name: contract
# Blockierendes Naht-Gate: Contract-Tests + Schema-Drift bei jedem PR.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Schema-Drift-Gate
        run: python scripts/gen_schema.py --check
      - name: Contract-Tests (Naht-Invarianten)
        run: pytest tests/contract -q
