name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,api]"
      - name: Lint
        run: ruff check .
      - name: Full test suite
        run: pytest -q
      - name: Visual render smoke (Raster-Pfad, plattform-tolerant)
        # Regenerate-Modus: rendert DXF→PNG und übt den kompletten Raster-Pfad (fängt
        # Crashes), OHNE plattform-abhängigen Pixel-Vergleich (Golden ist maschinen-
        # spezifisch = lokales Regressions-Werkzeug, kein Cross-Plattform-Gate).
        run: NOTBEL_UPDATE_GOLDEN=1 pytest -m visual -q
