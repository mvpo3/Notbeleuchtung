[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notbeleuchtung"
version = "0.0.0"
description = "ÖNorm-konforme Notbeleuchtungs-Platzierung (EN 1838) — Architektplan → Notbeleuchtungs-DXF"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "ezdxf>=1.3",
    "shapely>=2.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "jsonschema>=4.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests", "scripts"]
line-length = 100
