  version: 0.3.3
  norm_basis:
    - "OVE E 8015:2022 (Mindeststromkreise + Mindestausstattung Wohnungen)"
    - "OVE E 8101:2025 §411/415/531/701 (Schutzmassnahmen)"
    - "OVE E 8001:2010 (allgemeine elektrische Sicherheit)"
  filename_legacy_note: "Dateiname '8015' ist historisch -- Inhalt deckt 8001/8101/8015 ab"
  vorgaenger:
    branch: "enis/circuit-rules-ove-8015 (abandoned)"
    commit: "b02d50b"
    note: "v0.1.0 Strukturer (Mai 2026), nie gemerged."
  basis: "v0.1.0-Strukturer + H-11 LB-Substanz (Mollgasse 240718)"
  created: "2026-06-07"
  extract_ref: "docs/extracts/lb_elektro_240718_h11_extract.md"
  architektur_adr: "docs/decisions/0012-track-b-was-vs-wie-trennung.md"
  lb_quelle: |
    LB Elektro 240718 (Mollgasse 15, 1180 Wien) - 48 Seiten, Juni 2024.
    Kern-Sektionen: §5.1.5-5.1.14 (Technik + Verteiler), §5.1.15 (Raumbuch).
  owner: "Enis (Track B - Domain & Normen)"
  reviewer: "Leonis (Track A - Code)"
  related_files:
    - "OVE E 8015:2022 (Mindeststromkreise + Mindestausstattung Wohnungen)"
    - "OVE E 8101:2025 §433 (Schutz bei Ueberlast)"
    - "OVE E 8101:2025 §701 (Bad/Dusche - RCD 30mA)"
    - "TAEV 2012 (Anschlusswert-Konvention - separate Quelle, NICHT OVE)"
    - "OEVE EN 62305-3 (Blitzschutz, Schutzklasse III)"
    - "EN 60439-3 (Unterverteiler-Bauform)"
    - ".claude/skills/elektroplaner-dev/references/oenorm-wissen.md"
    - ".claude/skills/elektroplaner-dev/references/leistungsbeschreibung.md"
    - "backend/rules/device_counts_ove_e8015.yaml (WAS-Single-Source Mindestmengen)"
    - "backend/rules/room_humidity_classes.yaml (RCD-Pflicht-Raumklassen)"
    - "backend/rules/heights_fachpraxis.yaml (Komponenten-Vocabulary + LB-Hoehen-Override)"
    - "backend/rules/dxf_layer_convention.yaml (Layer-Mapping)"
    - "backend/rules/positioning_rules.yaml (Side-Effect Sprint #2 - existiert noch nicht)"
  spec_einbindung: |
    Schnellprueflist in oenorm-wissen.md (Compliance-Acceptance-Quelle) muss
    durch Regeln in dieser YAML abgedeckt sein. Sektion 15 compliance_acceptance
    mappt jeden Schnellpruef-Punkt auf die zugehoerige Regel.
  vocab_disziplin: |
    Komponenten-Bezeichner (geraeteanschluss_eherd, anschluss_wohnungsstation
    etc.) und Conditional-Schema (wenn/dann/sonst_verschieben_in/sonst_dann)
    sind aus leistungsbeschreibung.md uebernommen. KEINE Parallel-Vocabulary.
    NEU in v0.2.0: comp.kind heizungssteuerung_wohnungsstation (SK-12) ist
    Vocab-DEPENDENCY - Eintrag in heights_fachpraxis.yaml fehlt noch -> OQ-12.

