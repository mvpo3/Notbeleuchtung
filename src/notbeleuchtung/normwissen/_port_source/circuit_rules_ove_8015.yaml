      Existing heights_fachpraxis.yaml verteiler_wohnung.ok_mm = 1600 mm
      (Fachpraxis-Default). LB Mollgasse setzt explizit auf 2050 mm. Nach
      Architektur-Regel "LB > Referenzplan > Fachpraxis" hat LB-Override
      Vorrang. Engine muss bei Mollgasse-Projekten 2050 mm setzen, bei
      anderen LBs ohne explizite Vorgabe bleibt 1600 mm. Sprint #2:
      Hinweis-Eintrag in heights_fachpraxis.yaml verteiler_wohnung.notizen.

# ============================================================
# 15. COMPLIANCE-ACCEPTANCE (15 Pruefpunkte)
# ============================================================
# Schnellprueflist aus oenorm-wissen.md + H-11 LB-Pruefpunkte.

compliance_acceptance:

  schnellprueflist_mapping:

    - pruefung: "Mindestanzahl Stromkreise erreicht (E 8015 Tab. 1)?"
      abgedeckt_durch: "device_counts_ove_e8015.yaml::circuits_by_floor_area + Sektion 8 Verweis"
      validator_pseudocode: |
        actual_circuits = count(stromkreise_in_wohnung)
        soll = lookup_norm_table(wohnungs_qm)  # 50/80/130 m2 -> 4/5/6/8
        assert actual_circuits >= soll

    - pruefung: "RCD 30mA fuer Bad/Aussen/Garage/Keller/Steckdosen <=32A?"
      abgedeckt_durch: "Sektion 5 rcd_pflicht (RCD-01 bis RCD-04)"
      validator_pseudocode: |
        for sk in stromkreise:
          if sk.bereich in [bad, aussen, garage, keller]: assert sk.rcd == "30mA"
          if sk.bereich == steckdose and sk.nennstrom_a <= 32: assert sk.rcd == "30mA"

    - pruefung: "E-Herd hat eigenen 3-phasigen LS?"
      abgedeckt_durch: "Sektion 10 SK-01"
      validator_pseudocode: |
        eherd_circuits = filter(stromkreise, comp.kind == geraeteanschluss_eherd)
        assert len(eherd_circuits) >= 1
        for c in eherd_circuits: assert c.ls_typ_ref == ls_16a_3n_5te

    - pruefung: "Bad-Steckdosen getrennt von Bad-Beleuchtung?"
      abgedeckt_durch: "Sektion 10 SK-02"
      validator_pseudocode: |
        bad_steckdose_sks = filter_by_bereich(bad_steckdose)
        bad_licht_sks = filter_by_bereich(bad_licht)
        assert intersection(bad_steckdose_sks, bad_licht_sks) == empty

    - pruefung: "WaMa + GS je eigener LS (LB-Override)?"
      abgedeckt_durch: "Sektion 10 SK-04 (je_geraet_eigener_ls: true)"
      validator_pseudocode: |
        wama_sks = filter(stromkreise, comp.kind == geraeteanschluss_waschmaschine)
        gs_sks   = filter(stromkreise, comp.kind == geraeteanschluss_geschirrspueler)
        assert intersection(wama_sks, gs_sks) == empty

    - pruefung: "Trockner + Mikrowelle bei V2+ je eigener LS?"
      abgedeckt_durch: "Sektion 10 SK-05 + SK-06"
      validator_pseudocode: |
        if variante >= 2:
          for kind in [geraeteanschluss_trockner, geraeteanschluss_mikrowelle]:
            sks = filter(stromkreise, comp.kind == kind)
            for sk in sks: assert sk.je_geraet_eigener_ls == True

    - pruefung: "Verteiler-Platzreserve >= 30%?"
      abgedeckt_durch: "Sektion 11 verteiler_defaults.platzreserve_min_prozent_wv + Sektion 12 agv_platzreserve_prozent"
      validator_pseudocode: |
        belegung = used_te / total_te
        assert (1 - belegung) >= 0.30

    - pruefung: "Variante-Detection korrekt aus LB-Text abgeleitet?"
      abgedeckt_durch: "Sektion 9 variante_detection"
      validator_pseudocode: |
        lb_text_lower = lb_text.lower()
        if any(kw in lb_text_lower for kw in ['dampfgarer']): variante = 3
        elif any(kw in lb_text_lower for kw in ['backrohr', 'backofen', 'trockner', 'mikrowelle']): variante = 2
        else: variante = 1

    - pruefung: "FI-Mapping max 2 Drehstrom ODER 6 x 230V pro FI?"
      abgedeckt_durch: "Sektion 6 fi_mapping_regeln.max_drehstromkreise_pro_fi + max_230v_stromkreise_pro_fi"
      validator_pseudocode: |
        for fi in verteiler.fi_liste:
          drehstrom_count = count(fi.stromkreise where polig == "3+N")
          v230_count = count(fi.stromkreise where polig in ["1+N", "1-polig"])
          assert drehstrom_count <= 2 OR v230_count <= 6

    - pruefung: "FI-Mapping max 9 LS pro FI bei 230V?"
      abgedeckt_durch: "Sektion 6 fi_mapping_regeln.max_ls_pro_fi_230v"
      validator_pseudocode: |
        for fi in verteiler.fi_liste:
          if all(sk.polig in ["1+N", "1-polig"] for sk in fi.stromkreise):
            assert len(fi.ls_liste) <= 9

    - pruefung: "UV-FI-Gruppen-Trennung (4 Gruppen) eingehalten?"
      abgedeckt_durch: "Sektion 7 uv_spec.uv_fi_gruppen_trennung_ref -> Sektion 6 fi_gruppen_trennung_uv_pflicht"
      validator_pseudocode: |
        uv_fi_gruppen = group_fi_by_kind(uv)
        assert "Beleuchtung+Jalousien" in uv_fi_gruppen
        assert "Schuko_Wohn" in uv_fi_gruppen
        assert "Schuko_Reinigung_Allgemein" in uv_fi_gruppen
        assert "Geraete_Fix" in uv_fi_gruppen

    - id: COMP-FIRCD-01
      pruefung: "Jeder Circuit hat funktionsgruppe gesetzt?"
      abgedeckt_durch: "Sektion 6c kreistyp_zu_fi_funktionsgruppe (SK-01..SK-12)"
      validator_pseudocode: |
        for c in circuits:
          assert c.funktionsgruppe in [fg_beleuchtung, fg_schuko_wohn,
                                       fg_schuko_reinigung_allgemein, fg_geraete_fix]

    - id: COMP-FIRCD-02
      pruefung: "Bad-Kreise haben RCD-01 zugewiesen?"
      abgedeckt_durch: "Sektion 5 rcd_pflicht.RCD-01 + Sektion 5b rcd_zuordnung_regeln.bad_rcd_pflicht (RZ-01)"
      validator_pseudocode: |
        for c in circuits:
          if c.room.class == feuchtraum_pflicht or c.sk_rule_id == "SK-02":
            assert c.rcd_id == "RCD-01"
            assert c.fault_current_ma == 30

    - id: COMP-FIRCD-03
      pruefung: "Schuko <=32A in Wohnraum haben RCD-02 zugewiesen (RZ-03)?"
      abgedeckt_durch: "Sektion 5b rcd_zuordnung_regeln.schuko_32a_rcd_pflicht (RZ-03)"
      validator_pseudocode: |
        for c in circuits:
          if c.consumer_class.startswith("schuko") and c.breaker_ampere <= 32 \
             and c.room.class != feuchtraum_pflicht:
            assert c.rcd_id == "RCD-02"

    - id: COMP-FIRCD-04
      pruefung: "WV hat mindestens Bad-RCD separat (RZ-01 enforces)?"
      abgedeckt_durch: "Sektion 5b rcd_zuordnung_regeln.bad_rcd_pflicht (RZ-01) + Sektion 6 fi_gruppen_trennung_wv_praxis"
      validator_pseudocode: |
        for wv in projekt.wohnungsverteiler:
          bad_fi_groups = [g for g in wv.fi_groups
                           if any(c.sk_rule_id == "SK-02" for c in g.circuits)]
          non_bad_fi_groups = [g for g in wv.fi_groups if g not in bad_fi_groups]
          for bad_g in bad_fi_groups:
            for nb_g in non_bad_fi_groups:
              assert bad_g.fi_group_id != nb_g.fi_group_id

    - pruefung: "Wohnungsverteiler-OK Hoehe = LB-Override (Mollgasse 2050 mm)?"
      abgedeckt_durch: "Sektion 14 lb_explizite_hoehen.wohnungsverteiler_ok_ffbok"
      validator_pseudocode: |
        if projekt_kontext == "mollgasse_lb":
          assert wv.ok_mm == 2050
        else:
          assert wv.ok_mm == lookup(heights_fachpraxis::verteiler_wohnung.ok_mm)  # 1600 Default

    - pruefung: "TN-S 5-Leiter-Schutzmassnahme durchgaengig?"
      abgedeckt_durch: "Sektion 2 technische_grunddaten.schutzmassnahme_*"
      validator_pseudocode: |
        for verteiler in [zaehler, ht, bereich, wv, uv]:
          assert verteiler.schutzmassnahme == "Nullung + FI (TN-S) 5-Leiter"

    - pruefung: "Endstrom-Querschnitte min eingehalten (Steckdose 2,5 mm² / Beleuchtung 1,5 mm² Cu)?"
      abgedeckt_durch: "Sektion 2 technische_grunddaten.querschnitt_steckdose_16a_min + querschnitt_beleuchtung_230v_min"
      validator_pseudocode: |
        for sk in stromkreise:
          if sk.last_typ == "steckdose_16a": assert sk.querschnitt_mm2 >= 2.5
          if sk.last_typ == "beleuchtung_230v": assert sk.querschnitt_mm2 >= 1.5

    - pruefung: "AGV-Mindest-SK-Liste H-11 erfuellt (15 SKs nach LB Mollgasse §5.1.12)?"
      abgedeckt_durch: "Sektion 12 allgemein_garage_verteiler.allgemeinverteiler.mindest_stromkreise"
      validator_pseudocode: |
        for agv in projekt.allgemeinverteiler:
          erwartet = ["lichtkreise", "schuko_kraft", "aufzug", "stiegenhaus_licht",
                      "schuko_gaenge", "licht_keller_allgemein", "licht_aussen",
                      "schuko_keller", "kraft_keller", "tor_sprechanlage",
                      "aufzugschacht", "ventilator_muellraum",
                      "reserve_16a", "reserve_13a", "schaltschuetze"]
          for verbraucher in erwartet:
            assert any(sk.verbraucher.contains(verbraucher) for sk in agv.stromkreise)

    - id: COMP-ZS-01
      pruefung: "Drehstrom-Kreis-Belegung korrekt gezaehlt (1 Belegung egal wie viele LS-Geraete)?"
      abgedeckt_durch: "Sektion 6d zaehl_semantik_fi_limits.ZS-01"
      validator_pseudocode: |
        for fi in verteiler.fi_liste:
          drehstrom_circuits = [c for c in fi.circuits if c.drehstrom_belegung]
          assert len(drehstrom_circuits) <= 2  # max_drehstromkreise_pro_fi
          # Jeder Drehstromkreis zaehlt 1, egal ob c.ls_einheiten == 1 (Kombi) oder 3 (Multiplier)

    - id: COMP-ZS-02
      pruefung: "Multiplier 'N Stk LS' als 1 logischer Kreis erkannt?"
      abgedeckt_durch: "Sektion 6d zaehl_semantik_fi_limits.ZS-02"
      validator_pseudocode: |
        for sk in stromkreise:
          if sk.lb_wortlaut.matches("N Stk LS"):
            # ein Circuit mit ls_einheiten == N, NICHT N getrennte Circuits
            assert sk.circuit_count == 1
            assert sk.ls_einheiten >= 1

    - id: COMP-ZS-03
      pruefung: "LS-Zaehlung = physische Schaltgeraete (nicht TE, nicht Pole)?"
      abgedeckt_durch: "Sektion 6d zaehl_semantik_fi_limits.ZS-03"
      validator_pseudocode: |
        for fi in verteiler.fi_liste:
          total_ls = sum(c.ls_einheiten for c in fi.circuits)
          assert total_ls <= 9  # max_ls_pro_fi_230v
          # 1+N-Kombi-Gerät = 1 LS-Einheit (egal ob 1TE oder 2TE physisch)
          # 3x 1-polig Drehstrom-Multiplier = 3 LS-Einheiten

    - id: COMP-ZS-04
      pruefung: "Mischbelegung Drehstrom + 230V via Aequivalent-Konversion (ZS-04b) ODER XOR (ZS-04a)?"
      abgedeckt_durch: "Sektion 6d zaehl_semantik_fi_limits.ZS-04a (XOR, lb_explizit) + ZS-04b (Aequivalent, fachpraxis)"
      validator_pseudocode: |
        for fi in verteiler.fi_liste:
          drehstrom_count = sum(1 for c in fi.circuits if c.drehstrom_belegung)
          v230_count = sum(1 for c in fi.circuits if not c.drehstrom_belegung)
          if engine_mode == "strict_xor":  # ZS-04a
            assert (drehstrom_count == 0 and v230_count <= 6) or (drehstrom_count <= 2 and v230_count == 0)
          else:  # ZS-04b Default
            aequivalente = drehstrom_count * 3 + v230_count
            assert aequivalente <= 6

# ============================================================
# 16. OPEN QUESTIONS / DECISIONS
# ============================================================

open_questions:

    - id: SK-OQ-01
      thema: "Variante-Detection: case-sensitive oder nicht?"
      befund: |
        LBs schreiben Begriffe gemischt: "Backrohr", "BACKROHR", "backrohr".
      decision_enis: "Case-insensitive (alles lower-case vor Match)."
      status: geklaert
      impact: "Niedrig"
      naechste_action: "Keine - in variante_detection.case_sensitivity verankert."

    - id: SK-OQ-02
      thema: "WaMa+GS getrennte LS: v0.1.0 'gemeinsam V1' vs v0.2.0 LB-Override 'je eigener LS'"
      befund: |
        v0.1.0 SK-04 hatte in Variante 1 WaMa+GS gemeinsam (Praxis, gtprojekt-LB).
        LB Mollgasse §5.1.14 listet je eigener LS, unabhaengig von Variante.
      decision_enis: |
        v0.2.0: Default-Change zu je eigener LS via LB-Override (SK-04
        je_geraet_eigener_ls: true). Audit-Trail via OQ-10 Konsolidierung.
      status: geklaert
      impact: "Mittel - betrifft alle Wohnungen ohne Trockner."
      naechste_action: "Konsolidierung-Hinweis OQ-10 in PR-Body dokumentieren."

    - id: SK-OQ-03
      thema: "Anschlusswert 18 kW: TAEV-Default oder EVU-spezifisch?"
      befund: |
        TAEV 2012 nennt 18 kW Default. LB Mollgasse zitiert explizit TAEV.
        Andere EVU (Wiener Netze/EVN/Salzburg AG) 16-22 kW Spanne moeglich.
      status: parkiert
      impact: "Mittel - betrifft Verteiler-Dimensionierung."
      naechste_action: "v0.3: EVU-Override via lb_standard_wishes.yaml; Warning bei <18 kW geplant."

    - id: SK-OQ-04
      thema: "Wohnungsverteiler 24/36/48 TE: zu kleinteilig oder OK?"
      befund: |
        Drei Schwellen sind grobe Praxis-Regel. Markt hat 18/30/42 TE Varianten.
      status: parkiert
      impact: "Niedrig - Verteiler-Wahl ist letzter Schritt."
      naechste_action: "v0.3: Verfeinerung wenn mehrere Bautraeger-LBs vorliegen."

    - id: SK-OQ-05
      thema: "Beleuchtung-Splitting bei groesseren Wohnungen: bei welchem qm?"
      befund: |
        SK-03 sagt 'bei groesseren Wohnungen Aufteilung nach Wohnbereich' ohne
        konkrete qm-Schwelle.
      decision_enis: |
        Splitting bei >100m² oder >2 Geschosse. Praxis-Empfehlung, keine Norm-Pflicht.
      status: geklaert
      impact: "Niedrig - kosmetisch"
      naechste_action: "Keine - SK-03 sonst_verschieben_in dokumentiert."

    - id: SK-OQ-06
      thema: "Backrohr-3-phasig-Schwelle: 50L Volumen ausreichend?"
      befund: |
        SK-07 nennt 50L als Schwelle. Markt: 60L+ Backrohre Standard, Kombi-
        Geraete 25-40L.
      status: parkiert
      impact: "Niedrig"
      naechste_action: "v0.3: Override im lb_standard_wishes.yaml bei <40L Backrohr."

    - id: SK-OQ-07
      thema: "Mindestanzahl Stromkreise: Norm-Tabelle vs LB-75m2-Heuristik"
      befund: |
        ADR-0012 verankert WAS-vs-WIE-Trennung. Mindestmengen liegen in
        device_counts_ove_e8015.yaml (Norm 50/80/130 m2). LB-75m2-Heuristik
        ist Anwendungs-Override-Logik fuer Mollgasse, kein Norm-Wert.
      decision_enis: |
        Sektion mindeststromkreise (8) bleibt Kommentar-Verweis. Validator-
        Pfad fuer Norm vs LB siehe OQ-08.
      status: geklaert
      impact: "Architektur-Korrektur, keine Regel-Aenderung."
      naechste_action: "Keine - ADR-0012 applied."

    - id: SK-OQ-08
      thema: "Validator-Pfad: Norm-Tab (50/80/130) vs LB-Tab (75 m2 Schwelle)"
      befund: |
        OVE E 8015 Tab. 1: 50/80/130 m2 -> 4/5/6/8 SKs.
        LB Mollgasse §5.1.14: 75 m2 -> 2 Licht/Schuko-Kreise; darueber +2-4.
        Beide Tabellen sind valide. Welche gewinnt im Validator?
      status: open
      impact: "Mittel - Validator-Korrektheit fuer Mollgasse-Projekt."
      naechste_action: |
        Track-A-Engine-Entscheidung (Sprint #2): max(norm_soll, lb_soll) als
        konservative Defaultlogik vorschlagen; LB-Override nur wenn lb_soll
        > norm_soll. Diskussion Mi 19:00 Sync.

    - id: SK-OQ-09
      thema: "Wand-Mindeststaerke 10cm: positioning_rules.yaml existiert noch nicht"
      befund: |
        wv_wand_mindeststaerke_ref verweist auf positioning_rules.yaml::
        wand_mindeststaerke_verteiler. Die YAML existiert noch nicht (Side-
        Effect aus H-11 Extract).
      decision_enis: |
        Sprint #2 Side-Effect: positioning_rules.yaml anlegen + Sektion
        wand_mindeststaerke_verteiler mit Wert 100mm (ideal 120-150mm) aus
        LB Mollgasse §5.1.14.
      status: geklaert
      impact: "Mittel - Forward-Reference im YAML, Engine-Auflocsung erst nach Sprint #2."
      naechste_action: "Sprint #2 Companion-PR: positioning_rules.yaml v0.1."

    - id: SK-OQ-10
      thema: "Konsolidierung-Stub: v0.1.0 -> v0.2.0 SK-04 Default-Change"
      befund: |
        OQ-02 dokumentiert den Default-Change WaMa+GS. Dieser Stub dient als
        Audit-Trail-Anker, falls Track-A oder QA spaeter den Grund fuer den
        Default-Change sucht.
      decision_enis: |
        Audit-Trail-Pointer: siehe OQ-02 (Decision-Eintrag) + PR #101 Body
        (Diff-Highlight gegen v0.1.0).
      status: konsolidiert
      impact: "Niedrig - Dokumentations-Anker."
      naechste_action: "Keine - Stub bleibt fuer Trace-back."

    - id: SK-OQ-11
      thema: "uv_einbauten Detaillisten (Stoermelde-Module, Schaltuhren, etc.)"
      befund: |
        uv_spec.uv_funktionen ist als String "Schalt+Schutz+Stoermelde" gefasst.
