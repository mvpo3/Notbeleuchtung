    - id: SK-OQ-16
      thema: "SK-01 ls_typ_ref Inkonsistenz: ls_16a_3n_5te (1 Geraet 5TE) vs LB-Wortlaut '3 Stk LS 16A 1-p 3TE'"
      befund: |
        SK-01 (E-Herd) verwendet aktuell ls_typ_ref: ls_16a_3n_5te
        (Kombi-3+N-Schaltgerät 5TE = 1 LS-Einheit). LB Mollgasse §5.1.14 S.30
        schreibt aber explizit "3 Stk LS 16A 1-p (Drehstrom) 3TE - E-Herd
        (3-polig)" = 3 physische 1-polige Schaltgeräte mit 3TE gesamt = 3
        LS-Einheiten. Funktional 1 Drehstromkreis (siehe ZS-01), aber LS-
        Belegung gegen max_ls_pro_fi_230v: 9 unterschiedlich (1 vs 3).
      status: RESOLVED
      resolution_datum: 2026-06-14
      pr_ref: "Sprint H-16 PR (folgt)"
      resolution: |
        Option B verbindlich (Multiplier). SK-01 nutzt 3x ls_16a_1n_1te (jeder
        1-polig 1TE) statt 1x ls_16a_3n_5te (Kombi-Gerät). Begruendung:
        1. LB Mollgasse §5.1.14 S.30 Wortlaut wortwoertlich "3 Stk LS 16A 1-p 3TE".
        2. ZS-02/ZS-03/ZS-01-Beispiele implizieren bereits Multiplier-Semantik
           (sonst Selbst-Widerspruch).
        3. Track-A bekommt parametrisierbare Engine via ls_einheiten +
           drehstrom_belegung Felder.
      impact: |
        Mittel - Multiplier-Slice (Track A) braucht Klarheit, ob SK-01-Default
        bleibt ls_16a_3n_5te (1 LS) oder auf 3x ls_16a_1n_1te wechseln muss
        (3 LS) zur LB-Konsistenz. Affects max_ls-Cap-Berechnung.
      naechste_action: |
        Sprint #18+: SK-01-Audit gegen LB Mollgasse Wortlaut. Optionen:
        (A) SK-01 ls_typ_ref bleibt ls_16a_3n_5te (Kombi-Gerät), LB-Wortlaut
            "3 Stk" wird als praktische Realisierungs-Variante interpretiert.
        (B) SK-01 ls_typ_ref wechselt auf "3x ls_16a_1n_1te" (Multiplier-
            Markierung), strikte LB-Wortlaut-Treue. Engine braucht
            Multiplier-Field in stromkreis_aufteilung.dann.
        Tier-Entscheidung mit Leonis abstimmen (Slice 18.46.x Multiplier-Slice).
      bezug: "Sprint #17 Track 2 H-15 entdeckt; H-15 selbst nur ueber ZS-Regeln antwortbar, SK-01-Schema-Update separat noetig."
