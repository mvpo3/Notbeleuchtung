# ============================================================
# 5b. RCD-ZUORDNUNG (v0.3.0, Selektivitaets-Logik)
# ============================================================
# Strukturierte RCD-Zuordnungs-Logik (RZ-01..RZ-04). Konsumiert von Engine
# (Sprint 18.45.x): Circuit.rcd_id + Circuit.rcd_typ + Circuit.fault_current_ma
# werden aus diesen Regeln + stromkreis_aufteilung[].dann.rcd-Dict abgeleitet.

rcd_zuordnung_regeln:

  bad_rcd_pflicht:
    rule_id: "RZ-01"
    bedingung: "Stromkreis versorgt Bad/Nassraum-Anwendungsbereich ODER durchquert Zone 1/2"
    rcd_pflicht: true
    rcd_typ_ref: "fi_4_40_003_ga"
    bemessungsdifferenzstrom_ma: 30
    rcd_id_referenz: "RCD-01"
    quelle: "OVE E 8101 §701.415.1.101 (bath_zones_ove.yaml::meta.rcd_requirement)"
    tier: oenorm
    confidence: 1.0
    pflicht_oder_praxis: pflicht

  bad_rcd_aufteilung_licht_vs_steckdose:
    rule_id: "RZ-02"
    bedingung: "Bad-Steckdosen + Bad-Beleuchtung im gleichen Bad"
    rcd_trennung_innerhalb_bad_pflicht: false
    bemerkung: |
      Norm-Mindestanforderung: 1 gemeinsamer Bad-RCD 30mA fuer alle Bad-Kreise reicht.
      Sturzgefahr-Schutz erfolgt durch Kreis-Trennung (SK-02 vs Bad-Licht-SK), nicht durch RCD-Trennung.
      Praxis-Empfehlung: 2 separate Bad-RCDs sind moeglich, nicht pflicht.
    quelle: "OVE E 8101 §701 + Fachpraxis (Sturzgefahr-Argument, kein expliziter §)"
    tier: fachpraxis
    confidence: 0.85
    pflicht_oder_praxis: praxis

  schuko_32a_rcd_pflicht:
    rule_id: "RZ-03"
    bedingung: "Steckdose <=32A in Wohnbereich (seit OVE E 8101:2018)"
    rcd_pflicht: true
    rcd_typ_ref: "fi_4_40_003_ga"
    rcd_id_referenz: "RCD-02"
    quelle: "OVE E 8101 §411.3.3 (2018+)"
    tier: oenorm
    confidence: 1.0
    pflicht_oder_praxis: pflicht

  aussen_rcd_pflicht:
    rule_id: "RZ-04"
    bedingung: "Aussensteckdose (witterungsexponiert)"
    rcd_pflicht: true
    rcd_typ_ref: "fi_4_40_003_ga"
    rcd_id_referenz: "RCD-03"
    quelle: "OVE E 8101 §411.3.3"
