# circuit_rules_ove_8015.yaml
# Stromkreis-Aufteilungs- und Verteiler-WIE-Regeln
# nach OVE E 8015:2022 + OVE E 8101:2025 + LB Elektro 240718 (Mollgasse) + Fachpraxis.
#
# Architektur: ADR-0012 (WAS-vs-WIE Trennung).
#   WAS (Mindestmengen, Pflichtwerte aus Norm-Tabellen) -> device_counts_*, heights_*, *_zones_*
#   WIE (Aufteilungs-Logik, Mappings, Anwendungs-Regeln) -> circuit_rules_*, lb_standard_wishes
# Bei WAS-Werten in dieser Datei: Verweis (ref:) statt Duplikation.
#
# Architektur-Regel: LB > Referenzplan > Fachpraxis > OVE-Verbote.
#
# Schema pro Eintrag (7 Pflichtfelder):
#   rule, value (ODER ref), einheit, quelle, tier, confidence, pflicht_oder_praxis
#   - Verweis-Eintraege haben "ref:" statt "value:", einheit "-"
#   - tier ∈ {lb_explizit, oenorm, fachpraxis}

# ============================================================
