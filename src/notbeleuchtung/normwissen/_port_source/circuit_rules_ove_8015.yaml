# ============================================================
# 8. MINDESTSTROMKREISE - VERWEIS (kein YAML-Datum hier)
# ============================================================
# ARCHITEKTUR (ADR-0012): Mindestmengen sind WAS-Werte und liegen in
#   backend/rules/device_counts_ove_e8015.yaml::circuits_by_floor_area
# Diese Datei (circuit_rules_ove_8015.yaml) ist WIE-Datei und enthaelt
# KEINE eigenen Mindestmengen, nur Aufteilungs-Logik (Sektion 10
# stromkreis_aufteilung) und Verteiler-Spec (Sektionen 11-12).
#
# Norm-Schwellen aus OVE E 8015:2022 Tab. 1 (S.14):
#   <= 50 m2     -> 4 Stromkreise (2 Steckdose + 2 Licht)
#   50 - 80 m2   -> 5 Stromkreise (3 + 2)
#   80 - 130 m2  -> 6 Stromkreise (4 + 2)
#   > 130 m2     -> 8 Stromkreise (5 + 3)
#
# LB-Konkretisierung Mollgasse (§5.1.14 S.30): "bis 75 m2 -> 2x Licht/Schuko
# Kreis 3,4 fuer 2 Zimmer; darueber zusaetzlich 2-4 Stk." (LB-Schwelle 75 m2
# weicht von Norm-Schwellen 50/80/130 ab -> siehe OQ-08).
#
# Konflikt-Hinweis: device_counts_ove_e8015.yaml haelt Norm-Tabelle (50/80/
# 130). LB-Schwelle 75 ist LB-Override-Anwendungs-Logik und gehoert NICHT
# in device_counts. Validator-Pfad fuer "welche Tabelle gewinnt?" ist OQ-08.

# ============================================================
# 9. VARIANTE-DETECTION (v0.1.0 1:1)
# ============================================================
# Variante 1/2/3 nach OVE E 8015 (Grund/Standard/Komfort).
# primary_source = oenorm-wissen.md (Trigger-Definition dort).

variante_detection:

  primary_source: ".claude/skills/elektroplaner-dev/references/oenorm-wissen.md"

  case_sensitivity: insensitive
  matching_strategie: "alle Strings auf lower-case bevor Trigger-Match"

  trigger_woerter:
    variante_2_standard:
      keywords: ["backrohr", "backofen", "trockner", "mikrowelle"]
      bemerkung: "Wenn LB einen dieser Begriffe enthaelt -> Variante 2"
      quelle: "oenorm-wissen.md"

    variante_3_komfort:
      keywords: ["dampfgarer"]
      bemerkung: "Dampfgarer triggert Variante 3"
      quelle: "oenorm-wissen.md"

  default:
    variante: 1
    bezeichnung: "Grundausstattung"
    bemerkung: "Wenn keine Variante-2/3-Trigger im LB -> Variante 1 (Grund)"

# ============================================================
# 10. STROMKREIS-AUFTEILUNG (12 SK-Regeln SK-01..SK-12)
# ============================================================
# Pflicht-Trennungen + Praxis-Buendelungen + LB-Overrides.
# Conditional-Schema aus leistungsbeschreibung.md (wenn/dann/sonst_*).

stromkreis_aufteilung:

  - id: SK-01
    thema: "E-Herd 3-phasig: eigener LS"
    tier: oenorm
    confidence: 1.0
    pflicht_oder_praxis: pflicht
    quelle: "OVE E 8101 §433 + LB Elektro 240718 §5.1.14"
    conditional:
      wenn: "comp.kind == geraeteanschluss_eherd"
      dann:
        ls_typ_ref: ls_16a_1n_1te
        ls_einheiten: 3
        drehstrom_belegung: true
        stromkreis_id_pattern: "eherd_<wohnung_id>"
        rcd:
          rcd_pflicht: false
          funktionsgruppe: fg_geraete_fix
          pflicht_oder_praxis: praxis
          quelle: "3-phasig direkt vom Hauptverteiler; kein 30mA-RCD-Pflicht"
    bemerkung: |
      E-Herd 3-phasig MUSS eigenen LS haben - niemals geteilt mit anderen
      Verbrauchern. Begruendung: 3-phasige Symmetrie + Hochlast-Spitze beim
      Aufheizen. LB Mollgasse bestaetigt: "3 Stk LS 16A 1-p (Drehstrom)
      3TE - E-Herd (3-polig)".

      H-16-Resolution (Sprint H-16, 2026-06-14): OQ-16 RESOLVED mit Option B.
      SK-01 nutzt jetzt 3x ls_16a_1n_1te (LB-Wortlaut-treu) statt 1x ls_16a_3n_5te
      (Kombi). Funktional 1 Drehstromkreis (ZS-01) mit 3 physischen LS-Einheiten
      gegen max_ls_pro_fi_230v: 9 (ZS-03). drehstrom_belegung: true fuer ZS-04b
      Aequivalent-Konversion (3 230V-Aequivalente).

  - id: SK-02
    thema: "Bad-Steckdosen: getrennt von Bad-Beleuchtung"
    tier: oenorm
    confidence: 1.0
    pflicht_oder_praxis: pflicht
    quelle: "OVE E 8101 §701 + Sicherheits-Praxis"
    conditional:
      wenn: "comp.kind in [schuko_einfach, schuko_zweifach] AND room.class == feuchtraum_pflicht"
      dann:
        # 18.08.2026 (User-GO Leonis, Slice 2.38.0): ls_16a_1n -> ls_13a_1n.
        # Referenz-Autoritaet Verteiler-Schema Typ 1+2 (WHG_Verteiler-PDFs,
        # Blatt 2): 2F4 Schuko Bad+VR+AR+WC = LS 13A/1P+N/B, 3x1,5 mm2 —
        # der Generator wich mit 16A/2,5 systematisch auf allen 6 Boards ab.
        ls_typ_ref: ls_13a_1n
        stromkreis_id_pattern: "bad_steckdose_<bad_id>"
        rcd:
          rcd_id: "RCD-01"
          rcd_typ_ref: "fi_4_40_003_ga"
          funktionsgruppe: fg_schuko_reinigung_allgemein
          pflicht_oder_praxis: pflicht
          quelle: "OVE E 8101 §701.415.1.101"
        nicht_zusammen_mit: "Bad-Beleuchtung (separater LS)"
    bemerkung: |
      Bad-Steckdosen separat von Bad-Beleuchtung, weil RCD-Aufloesung bei
      Steckdosen-Fehler die Beleuchtung nicht ausschalten soll (Sturzgefahr
      bei Dunkelheit).

  - id: SK-03
    thema: "Beleuchtung Wohnung: mindestens ein eigener Stromkreis"
    tier: oenorm
    confidence: 1.0
    pflicht_oder_praxis: pflicht
    quelle: "OVE E 8015:2022 (impliziert durch Mindeststromkreise Tab. 1)"
    conditional:
      wenn: "comp.kind in [deckenauslass, wandauslass, leuchte_decke, lampe_typ_*]"
      dann:
        ls_typ_ref: ls_10a_1n_2te
        stromkreis_id_pattern: "beleuchtung_<wohnung_id>_<n>"
        rcd:
          rcd_id: "RCD-02"
          rcd_typ_ref: "fi_4_40_003_ga"
          funktionsgruppe: fg_beleuchtung
          pflicht_oder_praxis: pflicht
          quelle: "OVE E 8101 §411.3.3 (RCD-Pflicht alle Endkreise <=32A Wohnraum, seit 2018)"
        sonst_verschieben_in: "Bei Wohnung >100m² oder mehrgeschossig -> Splitting nach Wohnbereichen"
    bemerkung: |
      Mindestens ein Beleuchtungs-LS pro Wohnung. Bei groesseren Wohnungen
