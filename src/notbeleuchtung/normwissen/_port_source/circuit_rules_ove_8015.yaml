    pflicht_oder_praxis: pflicht

# ============================================================
# 6. FI-MAPPING-REGELN (NEU H-11, §5.1.12 S.28)
# ============================================================
# Max-Belegung pro FI. LB-Quelle primaer AGV, Anwendung auf WV+Garage+UV als
# Fachpraxis-Erweiterung (siehe geltungsbereich + bemerkung).

fi_mapping_regeln:

  - rule: max_drehstromkreise_pro_fi
    value: 2
    einheit: "Drehstromkreise"
    quelle: "LB Elektro 240718 §5.1.12 S.28 (Allgemeinverteiler)"
    tier: lb_explizit
    confidence: 1.0
    pflicht_oder_praxis: pflicht
    geltungsbereich: ["allgemeinverteiler", "garagenverteiler", "wohnungsverteiler", "unterverteiler"]
    bemerkung: |
      Quelle primaer AGV LB S.28 §5.1.12; Anwendung auf WV+Garage+UV als
      Fachpraxis-Erweiterung (gleiche FI-Topologie, gleiche Selektivitaets-
      Logik). Bei Einzelfall-Abweichung (z.B. Sonderwunsch-UV) Override
      ueber lb_standard_wishes.yaml moeglich.
      Zaehl-Semantik: 1 Drehstromkreis = 1 Belegung gegen dieses Limit,
      unabhaengig wie viele physische Schaltgeraete der Drehstromkreis
      hat (1x 3+N-Kombi-Gerät vs 3x 1-polig). Siehe Sektion 6d ZS-02.

  - rule: max_230v_stromkreise_pro_fi
    value: 6
    einheit: "230V-Stromkreise"
    quelle: "LB Elektro 240718 §5.1.12 S.28"
    tier: lb_explizit
    confidence: 1.0
    pflicht_oder_praxis: pflicht
    geltungsbereich: ["allgemeinverteiler", "garagenverteiler", "wohnungsverteiler", "unterverteiler"]
    bemerkung: |
      LB-Wortlaut "Alternativ zu Drehstrom: 6x 230V ODER 2x Drehstrom pro FI"
      ist als XOR (Spezialfall) zu lesen. Sprint #17 Track 2 (H-15) erweitert
      die Semantik um Aequivalent-Konversion fuer Mischbelegung: 1 Drehstromkreis
      ~ 3 230V-Aequivalente. Siehe Sektion 6d ZS-04a (XOR, lb_explizit) +
      ZS-04b (Aequivalent-Konversion, fachpraxis, conf 0.85).

  - rule: max_ls_pro_fi_230v
    value: 9
    einheit: "LS"
