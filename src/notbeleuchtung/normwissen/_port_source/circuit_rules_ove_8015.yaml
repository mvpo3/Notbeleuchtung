# ============================================================
# 6d. ZAEHL-SEMANTIK FI-GRUPPEN-LIMITS (v0.3.2, Sprint #17 Track 2 / H-15)
# ============================================================
# Beantwortet H-15 (Leonis, 13.06.): Wie zaehlt der Allocator
# (`_assign_fi_groups` / `_fi_group_add`) Drehstrom / Multiplier /
# Multi-LS gegen die fi_mapping_regeln.max_*-Caps?
#
# Engine-Konsum: Slice 18.46.x Multiplier-Slice -- jeder Circuit kriegt
# `ls_einheiten` (int) + `drehstrom_belegung` (bool). FiGroup-Counter
# `circuit_count_drehstrom` zaehlt Drehstrom-Kreise, `circuit_count_230v`
# zaehlt 230V-Aequivalente (Aequivalent-Konversion ZS-04b), `ls_count`
# summiert physische LS-Schaltgeraete (ZS-03).

zaehl_semantik_fi_limits:

  ZS-01:
    rule: "drehstrom_kreis_belegung"
    thema: "Drehstrom-Kreis-Belegung gegen max_drehstromkreise_pro_fi"
    regel: "1 Drehstromkreis (3-phasig) = 1 Belegung gegen max_drehstromkreise_pro_fi, unabhaengig von Anzahl physischer Schaltgeraete."
    beispiel: |
      E-Herd Default per SK-01 (LB-Wortlaut-treu, Sprint H-16): 3x ls_16a_1n_1te
      = 1 Drehstromkreis mit ls_einheiten: 3. Verbraucht 1 Slot von
      max_drehstromkreise_pro_fi: 2 + 3 Einheiten gegen max_ls_pro_fi_230v: 9.
    quelle: "LB §5.1.12 S.28 + Fachpraxis (FI-Selektivitaet ist kreis-basiert, nicht geraete-basiert)"
    tier: lb_explizit
    confidence: 1.0
    pflicht_oder_praxis: pflicht

  ZS-02:
    rule: "multiplier_semantik_n_stk_ls"
    thema: "Multiplier-Semantik 'N Stk LS' fuer EINEN Verbraucher"
    regel: "'N Stk LS' in LB-Wortlaut fuer einen Verbraucher (z.B. E-Herd '3 Stk LS 16A 1-p 3TE') = 1 logischer Stromkreis mit N physischen Schaltgeraeten."
    beispiel: |
      LB-Wortlaut "3 Stk LS 16A 1-p (Drehstrom) 3TE - E-Herd (3-polig)" bedeutet:
      1 funktionaler 3-phasiger Drehstromkreis, realisiert ueber 3 physische
      1-polige LS-Schaltgeraete (3 TE gesamt). NICHT 3 getrennte Stromkreise.
      Generelle Regel: gilt fuer alle 'N Stk LS' Multiplier-Faelle (Drehstrom,
      Multi-Pol, Sub-LS-Belegung).
    quelle: "LB Elektro 240718 §5.1.14 S.30 (E-Herd Wortlaut) + Fachpraxis"
    tier: lb_explizit
    confidence: 1.0
    pflicht_oder_praxis: pflicht

  ZS-03:
    rule: "ls_zaehlung_physische_schaltgeraete"
    thema: "'LS' in max_ls_pro_fi_230v zaehlt physische Schaltgeraete"
    regel: "max_ls_pro_fi_230v: 9 = max 9 physische LS-Schaltgeraete (TE-getrennte Geraete), NICHT 9 logische Stromkreise."
    beispiel: |
      1+N-Kombi-Schuko-LS (z.B. ls_10a_1n_2te, 2TE) = 1 LS-Einheit.
      1-poliges LS (z.B. Beleuchtung 1-polig 1TE) = 1 LS-Einheit.
      Multi-pol Kombi-Gerät (3+N-Drehstrom, 5TE) = 1 LS-Einheit.
      3x 1-polig Drehstrom-Multiplier (3x 1TE) = 3 LS-Einheiten.
      Physische TE-Anzahl ist nicht relevant fuer Zaehlung, nur Schaltgerät-Anzahl.
    quelle: "LB §5.1.12 S.28 + Fachpraxis (Verteiler-Bauform ist TE-Schaltgerät-basiert)"
    tier: lb_explizit
    confidence: 1.0
    pflicht_oder_praxis: pflicht

  ZS-04a:
    rule: "mischbelegung_xor_lb_wortlaut"
    thema: "Mischbelegung Drehstrom + 230V (XOR-Variante, LB-Wortlaut)"
    regel: "Pro FI entweder bis 2 Drehstromkreise ODER bis 6 230V-Stromkreise (XOR). Keine Mischbelegung erlaubt."
    beispiel: |
      Variante A: 2x Drehstrom + 0x 230V (Cap erreicht)
      Variante B: 0x Drehstrom + 6x 230V (Cap erreicht)
      Variante AB (gemischt): NICHT erlaubt unter XOR-Variante.
    quelle: "LB Elektro 240718 §5.1.12 S.28 (Wortlaut 'Alternativ zu Drehstrom')"
    tier: lb_explizit
    confidence: 1.0
    pflicht_oder_praxis: pflicht
    bemerkung: |
      LB-Wortlaut wortwoertlich gelesen. Strikteste Auslegung. Wenn der
      Verteiler-Planer dies wahlt, ist es normgerecht und konvention-konform.

  ZS-04b:
    rule: "mischbelegung_aequivalent_konversion_praxis"
    thema: "Mischbelegung Drehstrom + 230V (Aequivalent-Konversion, Fachpraxis)"
    regel: "Mischbelegung erlaubt mit Aequivalent-Konversion: 1 Drehstromkreis ~ 3 230V-Aequivalente gegen max_230v-Cap. Gesamt-Cap = 6 Aequivalente."
    beispiel: |
      1 Drehstrom + 3 230V = 3+3 = 6 Aequivalente <= 6 max_230v ✓
      0 Drehstrom + 6 230V = 0+6 = 6 Aequivalente <= 6 max_230v ✓ (=ZS-04a Variante B)
      2 Drehstrom + 0 230V = 6+0 = 6 Aequivalente <= 6 max_230v ✓ (=ZS-04a Variante A)
      1 Drehstrom + 4 230V = 3+4 = 7 > 6 -> NICHT erlaubt
      Zusaetzlich: max_ls_pro_fi_230v: 9 als Hard-Cap auf physische LS-Anzahl.
    quelle: "Fachpraxis-Enis (LB-Aequivalent-Logik aus XOR-Spezialfall generalisiert)"
    tier: fachpraxis
    confidence: 0.85
    pflicht_oder_praxis: praxis
    bemerkung: |
      Aequivalent-Faktor 1 Drehstrom : 3 230V leitet sich aus XOR-Grenzwerten
      ab (2 Drehstrom = 6 230V als Cap). ZS-04a ist Spezialfall hiervon
      (Ecken des Loesungs-Polyeders). Verteiler-Planer kann ZS-04a (strikt)
      ODER ZS-04b (flexibel) wahlen je nach LB-Auftrag-Praezision. Engine
      sollte ZS-04b als Default verwenden (deckt mehr reale Verteiler-Topo
      ab), aber ZS-04a-Validation als Strenge-Modus anbieten.

