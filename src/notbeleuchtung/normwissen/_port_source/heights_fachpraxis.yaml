    notes: "Sprechstelle der Hauskommunikation in Wohnung. Bezugspunkt Geräte-Mitte (analog DIN 18015-3 OKFF-Konvention für Geräte-Mitten in Wohninstallation)."
    quelle: "Korpus session_01 + v2_vorraum (Track-B Fachpraxis). Bezugspunkt-Konvention Mitte gestützt durch Krimmling/Oberzig Haustechnik, Kap. 6.1.3, S. 367-374"
    tier: fachpraxis
    migration_note: "Sprint H-02 2026-06-14: tier added per ADR-0010 (praxis→fachpraxis, H-06 Sprint #9 Korpus)"
    pflicht_oder_praxis: praxis

  sprechstelle_aussen:
    uk_mm: null
    mitte_mm: 1400
    ok_mm: null
    condition: null
    components:
      - aussensprechstelle
      - hauskommunikation_aussen
    notes: "Sprechstelle am Hauseingang/Außenbereich. Gleicher Bezugspunkt wie Innensprechstelle (Geräte-Mitte)."
    quelle: "Korpus session_01 + v2_vorraum (Track-B Fachpraxis). Bezugspunkt analog sprechstelle_innen."
    tier: fachpraxis
    migration_note: "Sprint H-02 2026-06-14: tier added per ADR-0010 (praxis→fachpraxis, H-06 Sprint #9 Korpus)"
    pflicht_oder_praxis: praxis

  bewegungsmelder:
    uk_mm: 2400
    praxis_alternative_uk_mm: 3000
    ok_mm: null
    condition: null
    components:
      - bewegungsmelder
    notes: >
      Hochmontage nahe Decke (ca. 2400 mm UK) für optimalen PIR-Erfassungswinkel
