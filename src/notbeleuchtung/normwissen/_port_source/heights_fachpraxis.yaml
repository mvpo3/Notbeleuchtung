# ═══════════════════════════════════════════════════════════════════════════
# heights_fachpraxis.yaml — Österreichische Fachpraxis-Einbauhöhen
# ═══════════════════════════════════════════════════════════════════════════
#
# LAYER 1 of the HeightResolver — project-independent static defaults.
# These are Austrian trade convention heights used when no LB-specific
# override (Layer 2) exists for the component.
#
# All heights are Unterkante (UK) or Oberkante (OK) above fertigem Fußboden
# (FFB) in millimetres.
#
# Sources:
#   - Österreichische TAEV (Technische Anschluss-Bedingungen EVN)
#   - Allgemeine österreichische Elektro-Fachpraxis
#   - OVE E 8015:2022 Anhang B.2.2 (S.24): NORMATIVE BESTÄTIGUNG der Höhen:
#       • Schalter: Mitte oberste Schaltstelle ≤ 105cm über FFB (→ UK 1050mm)
#       • Steckdosen Arbeitsplatte: BW-m Zone = 900–1100mm über FFB (UK 1050mm)
#       • Standard-Steckdosen: BW-u Zone = 150–350mm über FFB (UK 300mm typisch)
#     Vollständige Installationsbereichs-Definitionen in device_counts_ove_e8015.yaml.
#   Note: OVE E 8101:2025 section 55N01 (pages 507-535) specifies NO mounting
#   heights for sockets or switches. It covers socket type compliance
#   (OVE E 8684-1), overload protection, and UP-installation mechanics only.
#   Heights for residential installation come exclusively from Fachpraxis /
#   TAEV and (for bathroom zones) from OVE E 8101:2025 Teil 7-701 spatial
#   constraints, which are in bath_zones_ove.yaml.
#
# Sources v1.1.0 (Sprint #9a Aufstockung 2026-06-16):
#   Hersteller-Kataloge fuer Praesenz-/Bewegungsmelder + Aussenleuchten-
#   Wandhalter (keine Norm-Stuetzung -- Hersteller-Empfehlungen):
#     - Schrack VISIO 50 Katalog (k-geb-at21.part1+4+6, k-v55-at23.part1):
#         Bewegungs-/Praesenzmelder Decke 3000 mm + Wand 1100-2200 mm.
#     - ESYLUX KNX-Praesenzmelder Katalog (k-esy-at20.part4):
#         Querverifikation Decken-360-Grad-Hoehe (3000 mm hersteller-
#         uebergreifend einheitlich).
#     - Schrack-Sortiment 2020 (k-sort-a20.part20):
#         Wandhalter Aluminium 250 mm fuer Aussenleuchten.
#   570-Digest-Korpus lieferte fuer 8 von 10 anvisierten Domaenen KEINE
#   konkreten Hoehen -- EN 1838 + OVE E 8101 geben nur anwendungsabhaengige
#   Tabellen (Erkennungsweite l = z * h, Imax-Werte je Befestigungshoehe).
#   Sprint #9b/c-Kandidaten norm-substanzieller: bath_zones (OVE E 8101
#   Teil 7-701) + Kabelquerschnitte (OVE E 8001-6-61).
#
# ═══════════════════════════════════════════════════════════════════════════
#
# Quellen-Konvention (Audit-Schema):
# - norm_ref: Primaer-Quelle (Norm-Paragraph) → pflicht_oder_praxis: pflicht
# - quelle:   Sekundaer-Quelle (Fachpraxis, etc.) → pflicht_oder_praxis: praxis
# Siehe: tracks/b_domain/audits/2026-05-10-yaml-norm-audit.md (Score-Schema)
# ═══════════════════════════════════════════════════════════════════════════

meta:
  source: "Österreichische Fachpraxis / TAEV Konvention"
  status: stable
  schema_version: "1.2.1"
  curated_at: "2026-07-25"
  last_reviewed: "2026-07-25"
  changelog:
    - "1.2.1 (2026-07-25): User-Direktive — neue Regel steckdose_fr_bad
       (UK 1000 mm) fuer generische FR-Steckdosen im Bad ausserhalb der
       purpose-spezifischen Faelle (Waschtisch/Waschmaschine/Handtuch-
       heizung). Sprechstellen mitte_mm=1400 bestaetigt (bereits so)."
    - "1.2.0 (2026-07-25 S-C): PDF-Aufriss-Kalibrierung Mollgasse 15 —
       raumthermostat 1500→1400, steckdose_waschmaschine 1150→1300,
       steckdose_dunstabzug 2100→1950; 9 neue Fachpraxis-Regeln
       (bodennah_tuer/bett, kueche_oberschrank, waschtisch_spiegel,
       balkon, wandauslass_bad_spiegel, wandauslass_balkon,
       medien_bodennah, handtuchheizung)."
  units: "mm above FFB (Fertigfußboden)"
  fields:
    uk_mm: "Unterkante in mm (lower edge of device box). XOR mit mitte_mm."
    mitte_mm: "Geräte-Mitte in mm. XOR mit uk_mm. Engine kann via Symbol-Halbhöhe → uk_mm umrechnen."
    ok_mm: "Oberkante in mm (upper edge of device box); null = not specified. Unabhängig von uk_mm/mitte_mm."
    condition: "Optional Python-evaluable condition string. null = always applies."
    components: "List of catalog entry IDs this rule matches"
    tier: "ADR-0010 Tier (Sprint H-02 2026-06-14): oenorm | fachpraxis. Plus pflicht_oder_praxis parallel fuer Backward-Compat."
    migration_note: "Sprint-Audit-Note (Sprint H-02 2026-06-14): tier added per ADR-0010 (rueckwaerts-trackbar)"
    praxis_alternative_uk_mm: "Optionaler Hersteller-/Katalog-Alternativwert (NEU v1.1.0 Sprint #9a). Dokumentiert Hersteller-Empfehlung transparent wenn diese vom primaeren uk_mm abweicht. Engine-Prio niedrig -- uk_mm bleibt verbindlich."
  schema_regel: |
    Genau EINER von uk_mm oder mitte_mm muss gesetzt sein (XOR).
    ok_mm ist unabhängig und kann zusätzlich gesetzt werden.
    Bezugspunkt-Konvention:
      - uk_mm: Drucktaster, Schalter, Steckdosen (Geräte-Unterkante)
      - mitte_mm: Sprechstellen, Klingeltableaus (Geräte-Mitte, analog DIN 18015-3 OKFF)
  schema_version_legacy: "0.2.0"


heights:

  steckdose_arbeitsplatte:
    uk_mm: 1050
    ok_mm: null
    condition: "purpose_contains_arbeitsplatte"
    components:
      - schuko_zweifach
      - schuko_einfach
    notes: >
      Nur wenn purpose 'Arbeitsplatte' enthält (Küche, Küchenzeile). Vor
      steckdose_standard evaluiert. OVE-Wert primary (1050 mm, BW-m Mitte).
      Diskrepanz zu DIN 18015-3 dokumentiert: deutsche Pendant-Norm
      empfiehlt 1150 mm OKFF (Bild 6.37), 50 mm über OVE-BW-m-Max 1100.
      Beide Normen koexistieren; OVE-Wert ist österreichische Pflicht.
    norm_ref: "OVE E 8015:2022, Anhang B.1.1 BW-m (900–1100mm) + Anhang B.2.2 (S.24) primary; DIN 18015-3 Bild 6.37 empfiehlt 1150 OKFF (Cross-Reference, exceeds OVE BW-m max 1100 by 50mm)"
    tier: oenorm
    migration_note: "Sprint H-02 2026-06-14: tier added per ADR-0010 (pflicht→oenorm)"
    pflicht_oder_praxis: pflicht

  steckdose_waschmaschine:
    uk_mm: 1300
    ok_mm: null
    condition: "purpose_contains_waschmaschine_or_trockner"
    components:
      - schuko_einfach
      - schuko_zweifach
      - schuko_fr_einfach
    notes: >
      Waschmaschine/Trockner: UK 1300 mm (Direktanschluss über Gerät für
      einfachen Zugriff, Spritzbereich-Konform). Kalibriert an PDF-Ref
      Mollgasse 15 Blatt 3/3 — Bemaßung '130' neben WM-Symbol im Bad.
      FR-Variante ergänzt (Feuchtraum-Steckdose).
    quelle: "Fachpraxis-Enis + PDF-Aufriss Ref Mollgasse (S-C 2026-07-25)"
    tier: fachpraxis
    migration_note: "S-C 2026-07-25: uk_mm 1150→1300 nach PDF-Aufriss-Kalibrierung; schuko_fr_einfach in components ergänzt"
    pflicht_oder_praxis: praxis

  steckdose_dunstabzug:
    uk_mm: 1950
    ok_mm: null
    condition: "purpose_contains_dunstabzug"
    components:
      - schuko_einfach
    notes: >
      Dunstabzug über E-Herd: UK 1950 mm (Küchenzeile-Oberschrank-Höhe).
      Kalibriert an PDF-Ref Mollgasse 15 Blatt 3/3 — Bemaßung '195'
      oberhalb Küchenzeile. Vorher Fachpraxis-Range 2000-2200; PDF-Wert
      1950 am unteren Ende der Range, konsistent mit Standard-
      Oberschrank-Unterkante 1950 mm.
    quelle: "Fachpraxis-Enis + PDF-Aufriss Ref Mollgasse (S-C 2026-07-25)"
    tier: fachpraxis
    migration_note: "S-C 2026-07-25: uk_mm 2100→1950 nach PDF-Aufriss-Kalibrierung Mollgasse 15"
    pflicht_oder_praxis: praxis

  steckdose_mikrowelle:
    uk_mm: 1400
    ok_mm: null
    condition: "purpose_contains_mikrowelle"
    components:
      - schuko_einfach
    notes: "Mikrowelle im Oberschrank: UK 1350-1450mm (Fachpraxis)"
    quelle: "Fachpraxis-Enis"
    tier: fachpraxis
    migration_note: "Sprint H-02 2026-06-14: tier added per ADR-0010 (praxis→fachpraxis)"
    pflicht_oder_praxis: praxis

  steckdose_kuehlschrank:
    uk_mm: 150
    ok_mm: null
    condition: "purpose_contains_kuehl_or_gefrier"
    components:
      - schuko_einfach
    notes: "Kühl/Gefrierschrank: UK 100-200mm (Gerät-Rückseite unten)"
    quelle: "Fachpraxis-Enis"
    tier: fachpraxis
    migration_note: "Sprint H-02 2026-06-14: tier added per ADR-0010 (praxis→fachpraxis)"
    pflicht_oder_praxis: praxis

  steckdose_geschirrspueler:
    uk_mm: 300
    ok_mm: null
    condition: "purpose_contains_geschirrspueler"
    components:
      - schuko_einfach
    notes: "Geschirrspüler: UK 300mm (Standard-Höhe, spezifisch benannt)"
    quelle: "Fachpraxis-Enis"
    tier: fachpraxis
    migration_note: "Sprint H-02 2026-06-14: tier added per ADR-0010 (praxis→fachpraxis)"
    pflicht_oder_praxis: praxis

  # ── Spezifisch VOR steckdose_standard (Loop stoppt bei erstem Match) ──
  # NEU S-C 2026-07-25: Purpose-spezifische Steckdosen-Regeln aus PDF-Ref
  # Mollgasse 15 Blatt 3/3. Alle tier: fachpraxis, projekt-basiert.

  steckdose_bodennah_tuer:
    uk_mm: 120
    ok_mm: null
    condition: "purpose_contains_tuer"
    components:
      - schuko_einfach
      - schuko_zweifach
    notes: >
      Bodennahe Steckdose neben Wohnungstür / Türeingang (Staubsauger-
      Anschluss, Boden-Beleuchtung). PDF-Ref: '12' im Gangbereich.
    quelle: "PDF-Aufriss Ref Mollgasse (S-C 2026-07-25)"
    tier: fachpraxis
    migration_note: "S-C 2026-07-25: neu (PDF-Bemaßung '12' Gangbereich)"
    pflicht_oder_praxis: praxis

  steckdose_bodennah_bett:
    uk_mm: 100
    ok_mm: null
    condition: "purpose_contains_bett"
    components:
      - schuko_einfach
      - schuko_zweifach
    notes: >
      Bodennahe Steckdose am Bett-Kopfteil (Ladegerät, Nachttischlampe).
      PDF-Ref: '10' unter Bett-Symbol im Schlafzimmer.
    quelle: "PDF-Aufriss Ref Mollgasse (S-C 2026-07-25)"
    tier: fachpraxis
    migration_note: "S-C 2026-07-25: neu (PDF-Bemaßung '10' Bett)"
    pflicht_oder_praxis: praxis

  steckdose_kueche_oberschrank:
    uk_mm: 1950
    ok_mm: null
    condition: "purpose_contains_oberschrank"
    components:
      - schuko_einfach
    notes: >
      Steckdose oberhalb der Küchen-Oberschränke (Vorspann, Dunstabzug,
      Kühlschrank oben). PDF-Ref: '195' oben in Küchenzeile.
      Analog steckdose_dunstabzug, aber breiter (Oberschrank-generisch).
    quelle: "PDF-Aufriss Ref Mollgasse (S-C 2026-07-25)"
    tier: fachpraxis
    migration_note: "S-C 2026-07-25: neu (PDF-Bemaßung '195' Küchenzeile-Oberschrank)"
    pflicht_oder_praxis: praxis

  steckdose_waschtisch_spiegel:
    uk_mm: 370
    ok_mm: null
    condition: "purpose_contains_waschtisch_or_spiegel"
    components:
      - schuko_einfach
      - schuko_fr_einfach
    notes: >
      Niedrige Steckdose neben/unter Waschtisch oder Spiegel für Rasierer,
      Zahnbürste, Föhn. PDF-Ref: '37' seitlich Waschtisch im Bad.
      OVE-Bad-Zonen beachten — Zone 1 verboten, Zone 2 nur SELV/PELV
      oder RCD-geschützt. FR-Variante bevorzugt.
    quelle: "PDF-Aufriss Ref Mollgasse (S-C 2026-07-25)"
    tier: fachpraxis
    migration_note: "S-C 2026-07-25: neu (PDF-Bemaßung '37' Bad-Waschtisch)"
    pflicht_oder_praxis: praxis

  steckdose_balkon:
    uk_mm: 500
    ok_mm: null
    condition: "room_type_is_balkon"
    components:
      - schuko_einfach
      - schuko_fr_einfach
    notes: >
      Balkon-/Terrassen-Steckdose auf mittlerer Höhe (nicht bodennah,
      nicht Schalter-Höhe). PDF-Ref: '50' neben Balkon-Steckdose-Symbol.
      FR-Variante zwingend (Außenbereich, Feuchtraum-Regel).
    quelle: "PDF-Aufriss Ref Mollgasse (S-C 2026-07-25)"
    tier: fachpraxis
    migration_note: "S-C 2026-07-25: neu (PDF-Bemaßung '50' Balkon)"
    pflicht_oder_praxis: praxis

  steckdose_medien_bodennah:
    uk_mm: 100
    ok_mm: null
    condition: "purpose_contains_medien_bodennah"
    components:
      - schuko_einfach
      - schuko_zweifach
      - schuko_dreifach
      - mediendose
      - tv_antennendose
      - datendose_rj45
    notes: >
      Medien-Cluster (3-Fach-Steckdose + UPC + Glasfaser + RJ45) hinter
      TV-Möbel, bodennah. PDF-Ref: '10 10 12' unter TV-Wand im Wohnzimmer.
      Tiefer als kommunikation_standard (300 mm) weil hinter Möbel
      versteckt und Kabel-Zug-Erleichterung.
    quelle: "PDF-Aufriss Ref Mollgasse (S-C 2026-07-25)"
    tier: fachpraxis
    migration_note: "S-C 2026-07-25: neu (PDF-Bemaßung '10 10 12' TV-Wand)"
    pflicht_oder_praxis: praxis

  anschluss_handtuchheizung:
    uk_mm: 300
    ok_mm: null
    condition: "purpose_contains_handtuchheizung"
    components:
      - e_anschluss
      - schuko_fr_einfach
      - elektroauslass_230v
    notes: >
      Handtuchheizungs-/Trockner-Anschluss im Bad, unter dem Gerät.
      PDF-Ref: '30' neben Handtuchheizungs-Symbol. FR-Steckdose oder
      Direktanschluss je nach LB-Vorgabe. OVE-Bad-Zonen beachten.
    quelle: "PDF-Aufriss Ref Mollgasse (S-C 2026-07-25)"
    tier: fachpraxis
    migration_note: "S-C 2026-07-25: neu (PDF-Bemaßung '30' Handtuchheizung Bad)"
    pflicht_oder_praxis: praxis

  steckdose_fr_bad:
    uk_mm: 1000
    ok_mm: null
    condition: "room_type_is_bad"
    components:
      - schuko_fr_einfach
      - schuko_fr_zweifach
      - schuko_fr_dreifach
    notes: >
      Generische FR-Steckdose (Klappdeckel-Variante) im Bad, wenn kein
      spezifischer Purpose wie Waschtisch/Waschmaschine/Handtuchheizung
      greift. UK 1000 mm — Fachpraxis-Standard fuer Bad-Steckdosen ausser-
      halb der Zonen 0/1, hoch genug fuer Zone 2 mit RCD-Schutz. Steht
      NACH den purpose-spezifischen Bad-Regeln (waschtisch_spiegel 370,
      waschmaschine 1300, handtuchheizung 300) und VOR steckdose_standard.
    quelle: "Fachpraxis-Enis / User-Direktive 2026-07-25"
    tier: fachpraxis
    migration_note: "2026-07-25: neu (User-Direktive: FR-Steckdose Bad = 1000 mm generisch)"
    pflicht_oder_praxis: praxis

  steckdose_standard:
    uk_mm: 300
    ok_mm: null
    condition: null
    norm_ref: "OVE E 8015:2022, Anhang B.1.1 BW-u (150–350mm ab FFOK); DIN 18015-3 waagerechte Installationszone unten 150-450 mm (Cross-Reference, OVE-Wert 300mm liegt in beiden Zonen)"
    tier: oenorm
    migration_note: "Sprint H-02 2026-06-14: tier added per ADR-0010 (pflicht→oenorm)"
    components:
      - schuko_einfach
      - schuko_zweifach
      - schuko_dreifach
      - schuko_fr_einfach
      - schuko_fr_zweifach
      - schuko_fr_dreifach
      - kraftsteckdose
      - e_anschluss
      - elektroauslass_230v
      - elektroauslass_400v
    notes: "Standard-Steckdosenhöhe UK 300 mm. Feuchtraum-Varianten gleiche Höhe. OVE BW-u (150-350) und DIN 18015-3 waagerechte Installationszone unten (150-450) sind konsistent; 300 mm in beiden Zonen."
    pflicht_oder_praxis: pflicht

  schalter_standard:
    uk_mm: 1050
    ok_mm: null
    condition: null
    components:
      - ausschalter_einpolig
      - ausschalter_zweipolig
      - ausschalter_kontrolllicht
      - serienschalter
      - serienschalter_kontrollleuchte
      - wechselschalter
      - kreuzschalter
      - taster
      - taster_beleuchtet
      - schluesselschalter
      - dimmschalter
    notes: "Standard-Schalterhöhe UK 1050 mm (Europäische Norm-Montagehöhe). DIN 18015-3 (deutsche Pendant-Norm) bestätigt 1050 mm einheitlich -- normübergreifend konsistent."
    norm_ref: "OVE E 8015:2022, Anhang B.2.2 (S.24): Mitte oberste Schaltstelle ≤105cm über FFB; DIN 18015-3 S.410 bestaetigt 1050 mm einheitlich (Cross-Reference, identischer Wert)"
    tier: oenorm
    migration_note: "Sprint H-02 2026-06-14: tier added per ADR-0010 (pflicht→oenorm)"
    pflicht_oder_praxis: pflicht

  schalter_alternativ:
    uk_mm: 800
    mitte_mm: null
    ok_mm: null
    condition: praxis_alternative
    components:
      - schalter_taster
    notes: "Alternative Hoehe nach DIN 18015-3 'Hoehe der haengenden Hand' -- Praxis-Variante fuer Komfort/Ergonomie statt Standard 1050. Optionale Wahl bei modernen Installationen."
    norm_ref: "DIN 18015-3 S.410 (80 cm 'haengende Hand'-Variante)"
    tier: fachpraxis
    migration_note: "Sprint H-02 2026-06-14: tier added per ADR-0010 (praxis→fachpraxis, DIN-cited als Cross-Ref, aber Praxis-Variante)"
    pflicht_oder_praxis: praxis

  schalter_barrierefrei:
    uk_mm: 700
    mitte_mm: null
    ok_mm: null
    condition: barrierefrei
    components:
      - schalter_taster
    notes: "Barrierefreie Hoehe nach DIN 18015-3 fuer Rollstuhl-Bedienung. Pflicht bei behindertengerechten Wohnungen + Hotels + oeffentlichen Gebaeuden."
    norm_ref: "DIN 18015-3 S.410 (70 cm Rollstuhl-Hoehe); OENORM B 1600 (oesterreichische Pendant-Norm fuer Barrierefreiheit)"
    tier: oenorm
    migration_note: "Sprint H-02 2026-06-14: tier added per ADR-0010 (pflicht→oenorm, OENORM B 1600 Barrierefreiheit)"
    pflicht_oder_praxis: pflicht

  raumthermostat:
    uk_mm: 1400
    ok_mm: null
    condition: null
    components:
      - raumthermostat
    notes: >
      Ergonomische Ablese-/Bedienhöhe 1400 mm UK. Kalibriert an
      PDF-Ref Mollgasse 15 Blatt 3/3 (RR Electro 02.06.2025) —
      Aufriss Wohnzimmer bemaßt '140' neben RTH-Symbol.
    quelle: "Fachpraxis-Enis + PDF-Aufriss Ref Mollgasse (S-C 2026-07-25)"
    tier: fachpraxis
    migration_note: "S-C 2026-07-25: uk_mm 1500→1400 nach PDF-Aufriss-Kalibrierung Mollgasse 15"
    pflicht_oder_praxis: praxis

  # Ehemals klingel_sprech (v0.1.x, UK 1500 mm für 3 Komponenten gemeinsam) —
  # in Sprint #9 (H-06 Resolution) aufgesplittet in 3 separate Einträge mit
  # korrekten Bezugspunkten (UK für Drucktaster, Mitte für Sprechstellen).

  klingel_taster:
