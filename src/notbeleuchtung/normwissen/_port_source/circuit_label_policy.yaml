# circuit_label_policy.yaml
# Stromkreis-Label-Policy: F-Nummer-Allokation, Format, Phasen-Verteilung,
# Verteiler-Praefixe und semantisch->Label-Mapping.
#
# Architektur: ADR-0012 (WAS-vs-WIE Trennung) - WIE-File (Allokations- &
# Naming-Logik). Keine Mengen/Pflichtwerte hier; nur Mappings + Regeln.
#
# WICHTIG - F-Symbol:
#   "F" in "<V>F<N>.<S>" = Sicherungsautomat-Schaltzeichen nach IEC 60617.
#   F ist NICHT Phase L1/L2/L3. Phasen siehe Sektion 8 (phasen_verteilung).
#
# Architektur-Regel: LB > Referenzplan > Fachpraxis > OVE-Verbote.
#
# Schema pro Eintrag (7 Pflichtfelder):
#   rule, value (ODER ref), einheit, quelle, tier, confidence, pflicht_oder_praxis
#   - Verweis-Eintraege haben "ref:" statt "value:", einheit "-"
#   - tier ∈ {lb_explizit, oenorm, fachpraxis, referenzplan}
#   - "referenzplan" ist NEUE 4. Stufe (zwischen fachpraxis und oenorm einsortiert
#     in Praezedenz: LB > Referenzplan > Fachpraxis > OVE). ADR-0012-Update +
#     plan-learning L24-Update als FOLGE-PR.

# ============================================================
# 1. META
# ============================================================

meta:
  status: draft
  version: "0.1.0"
  vorgaenger:
    branch: "N/A (Greenfield)"
    note: "Erste Iteration der Label-Policy. Keine Vorgaenger-Datei."
  basis: |
    H-11 Punkt 5 (LB-Substanz Mollgasse §5.1.14 - FI/LS-Liste) +
    LB Elektro 240718 Mollgasse §5.1.14 (13 LS-Stromkreise + 2 FI-Gruppen) +
    plan-learning pattern-mining (L19 - "F6=Beleuchtung"-Pattern,
    Mollgasse-Referenzplan-Konvention).
  created: "2026-06-08"
  architektur_adr: "docs/decisions/0012-track-b-was-vs-wie-trennung.md"
  architektur_anmerkung: |
    tier "referenzplan" als 4. Stufe ist NEU in dieser Datei. ADR-0012-Update
    + plan-learning L24-Update folgen als separater PR (#108-FOLGE), nicht
    Teil dieses PRs. Diese Datei verankert die Praezedenz formal.
  extract_ref: "docs/extracts/lb_elektro_240718_h11_extract.md (§5.1.14)"
  lb_quelle: |
    LB Elektro 240718 (Mollgasse 15, 1180 Wien) §5.1.14 S.30 -
    13 explizite LS-Stromkreise + 2 FI-Gruppen pro Wohnungsverteiler.
  owner: "Enis (Track B - Domain & Normen)"
  reviewer: "Leonis (Track A - Code)"
  related_files:
    - "backend/rules/circuit_rules_ove_8015.yaml (Stromkreis-Aufteilungs-Regeln, SK-01..12)"
    - "backend/rules/positioning_rules.yaml (Wand-/Positionierungs-Regeln)"
    - "backend/rules/gleichzeitigkeit_wohnungstypen.yaml (Gleichzeitigkeitsfaktoren)"
    - "backend/rules/device_counts_ove_e8015.yaml (WAS-Mindestmengen)"
    - "backend/rules/heights_fachpraxis.yaml (Komponenten-Vocabulary)"
    - "backend/rules/lb_standard_wishes.yaml (LB-Schema + Fallback; Konsumer: Track-A Slice 18.44.0 VerteilerSpec rule:lb_override)"
    - ".claude/skills/elektroplaner-dev/references/elektrosymbole.md:166 (F-Symbol IEC 60617)"
    - ".claude/skills/elektroplaner-dev/references/cad-formate.md:179 (Label-Format)"
    - ".claude/skills/plan-learning/pattern-mining.md (L19 F6=Beleuchtung)"
    - "docs/TEAM_ONBOARDING.md:271-272 (1F6.1-Beispiel)"
    - "CLAUDE.md (Stromkreis-Format-Block - mit F=Phase-Korrektur in Folge-PR)"

# ============================================================
# 2. FORMAT_DEFINITION
# ============================================================

format_definition:

  - rule: label_format_template
    value: "<V>F<N>.<S>"
    einheit: "-"
    quelle: "elektrosymbole.md:166 + cad-formate.md:179 + TEAM_ONBOARDING.md:271-272 + CLAUDE.md (Stromkreis-Format-Block, mit Phase-Korrektur in Folge-PR)"
    tier: fachpraxis
    confidence: 1.0
    pflicht_oder_praxis: pflicht
    komponenten:
      V: "Verteiler-Index (z.B. '1' fuer Wohnung 1, 'AGV-' fuer Allgemein-Verteiler, 'GAR-' fuer Garage). Siehe Sektion 7."
      F: "Sicherungsautomat-Schaltzeichen nach IEC 60617. F ist KEIN Phasenbezeichner."
      N: "Laufende LS-Nummer im Verteiler (1, 2, 3, ...). Allocation siehe Sektion 5 + 6."
      S: "Laufende Verbraucher-Nummer am LS (1, 2, ...). Mehrere Verbraucher an einem LS = .1, .2, .3 ..."
    beispiele:
      - "1F6.1"      # Wohnung 1, LS-Nr 6 (Beleuchtung Mollgasse), 1. Verbraucher
      - "1F12.1"     # Wohnung 1, LS-Nr 12 (E-Herd Drehstrom), 1. Verbraucher
      - "AGV-F3.2"   # Allgemein-Verteiler, LS-Nr 3, 2. Verbraucher
    anti_pattern:
      - "LS.6.1"     # FALSCH (CLAUDE.md-Verbot)
      - "L1F6.1"     # FALSCH (L1 ist Phase, gehoert nicht in Label)

# B-Charakteristik-Hinweis:
# LS-Typ-Bezeichnungen in Sektion 5 fuehren B-Charakteristik (B10/B13/B16) als
# Fachpraxis-Default fuer Wohnungs-Installationen. LB Mollgasse §5.1.14 nennt
# nur Stromstaerke; B-Charakteristik ist impliziter Standard nach OVE E 8101
# fuer Endstromkreise in Wohnbauten (Auslesecharakteristik fuer ohmsche/leicht
# induktive Lasten).

# ============================================================
# 3. ALLOCATION_QUELLE
# ============================================================

allocation_quelle:

  - rule: label_allocation_quelle
    value: "lb_driven"
    einheit: "-"
    quelle: "PROJEKT_BACKLOG.md Z.31 + LB Mollgasse §5.1.14"
    tier: lb_explizit
    confidence: 1.0
    pflicht_oder_praxis: pflicht
    bemerkung: |
      F-Nummer-Allocation ist NICHT algorithmisch berechenbar. Quelle ist die
      LB: LB-Parser extrahiert die FI-/LS-Liste (siehe lb_standard_wishes.yaml
      Sektion fi_ls_kreisliste) und gibt sie als explizite Allokation an die
      Engine. Bei LB-Schweigen Fallback auf mollgasse_referenz_mapping
      (Sektion 5). Bei LB-Schweigen UND Nicht-Wohnbau Fallback auf
      universal_fachpraxis_reihenfolge (Sektion 6).
    fallback_kette:
      1: "LB-explizite FI-/LS-Liste (lb_standard_wishes.yaml.fi_ls_kreisliste)"
      2: "mollgasse_referenz_mapping (Sektion 5, F1-F13)"
      3: "universal_fachpraxis_reihenfolge (Sektion 6, generische Kategorien)"

# ============================================================
# 4. FI_ODER_LS_ONLY_SICHT
# ============================================================
# Frage: Werden FI-Schutzschalter in die F-Nummerierung einbezogen oder
# separat als FI1/FI2 nummeriert?

fi_oder_ls_only_sicht:

  - rule: fi_inclusion_in_f_numbering
    value: "fi_included"
    einheit: "-"
    quelle: "Mollgasse-Plan-Konvention + pattern-mining.md L19 ('F6=Beleuchtung passt nur zu FI-included')"
    tier: referenzplan
    confidence: 0.9
    pflicht_oder_praxis: praxis
    sichten:
      sicht_a_fi_included:
        beschreibung: "FI-Schutzschalter belegen F1, F2; LS-Stromkreise starten ab F3."
        beispiel: "F1=FI-A, F2=FI-B, F3..F13=LS-Stromkreise"
        verwendet_in: "Mollgasse-Referenzplan (Default)"
      sicht_b_ls_only:
        beschreibung: "F-Nummern nur fuer LS; FIs separat als FI1, FI2 nummeriert."
        beispiel: "FI1, FI2 separat; F1..F11=LS-Stromkreise"
        verwendet_in: "IEC-strenge Sicht (theoretisch)"
    bemerkung: |
      Default fi_included gemaess Mollgasse-Plan-Konvention. F6=Beleuchtung im
      pattern-mining L19 passt NUR zur fi_included-Sicht (in ls_only waere F6
      etwas anderes). LP-OQ-01 prueft, ob IEC-strenge ls_only-Sicht in
      anderen Bueros Standard ist.

