    kriterium:
      feld: netto_grundflaeche_m2
      bezeichnung: "Netto-Grundfläche"
      fussnote: "(1) Netto-Grundfläche"
    entscheidung:
      art: baender
      eingeschraenkt: {ueber: 200.0}
      uneingeschraenkt:
        nicht_aufloesbar: "Spalte 'Sicherheitsbeleuchtung, uneingeschränkt' der Zeile 10 nennt für Betriebsbauten keinen eigenen Schwellenwert, sondern verweist die Bestimmung an ein anderes Regelwerk: 'gemäß Arbeitsstättenverordnung (AStV)' (Ausgabe Mai 2023, Norm-S. 32 / PDF-S. 34; die Ausgabe April 2019 lautete an dieser Stelle noch 'nicht erforderlich', Norm-S. 29 / PDF-S. 31). Die AStV liegt im Repo vor (RIS-Ausdruck, Stand 2026-09-06) — auflösbar ist die Stufe trotzdem nicht: dieser Resolver wertet ausschließlich OIB-RL 2 Tabelle 6 aus, eine AStV-Auswertung ist weder implementiert noch fachlich geklärt (offen ist insbesondere, welche AStV-Anforderung der uneingeschränkten Stufe entspricht — AStV § 9 nennt weder Beleuchtungsart noch Beleuchtungsstärke)."
      unterhalb:
        text: "≤ 200 m² Netto-Grundfläche — Tabelle 6 Zeile 10 trifft für diesen Bereich keine Aussage (kein Umkehrschluss)."
      schwellentexte:
        eingeschraenkt: "> 200 m² Netto-Grundfläche"
    unsicherheiten:
      - kennung: zeile_10_astv_stufe
        wirkung: blockiert
        text: "MANUELL PRÜFEN — aus Zeile 10 ist bei > 200 m² Netto-Grundfläche MINDESTENS die eingeschränkte Sicherheitsbeleuchtung ableitbar. Ob zusätzlich die uneingeschränkte Stufe greift, verweist Tabelle 6 (Ausgabe Mai 2023, Norm-S. 32) an die Arbeitsstättenverordnung (AStV). Die AStV liegt seit 2026-09-06 als amtlicher RIS-Ausdruck im Repo; die Auswertung dieses Verweises ist aber weder in dieser Engine implementiert noch fachlich geklärt — welche AStV-Anforderung der uneingeschränkten Stufe entspricht, ist offen (§ 9 AStV nennt weder Beleuchtungsart noch Beleuchtungsstärke). Solange das offen ist, wird für Zeile 10 keine definitive Stufe zurückgegeben. Hinweis zur Ausgabe: April 2019 lautete diese Zelle noch 'nicht erforderlich'; der AStV-Anforderungspfad selbst bestand schon damals (Erläuterungen April 2019, gedr. S. 36)."
      - kennung: netto_grundflaeche_definition
        wirkung: blockiert
        text: "MANUELL PRÜFEN — die Netto-Grundfläche ist in den vorliegenden OIB-Dokumenten nirgends selbst definiert. Verweiskette (am Original geprüft 2026-08-30): Tabelle-6-Fußnote (1) lautet nur 'Netto-Grundfläche;' ohne eigenen Verweis (RL 2, Norm-S. 32 / PDF-S. 34) → RL 2 Punkt 1 verweist auf die OIB-Begriffsbestimmungen (Norm-S. 2 / PDF-S. 4) → deren Stichwort 'Grundfläche' (Norm-S. 7 / PDF-S. 9) verweist weiter auf die ÖNORM B 1800, Ausgabe 2013-08-01. Diese Norm liegt NICHT im Repo; die Bezugsfläche des Schwellenwerts 200 m² ist damit nicht verifizierbar."

