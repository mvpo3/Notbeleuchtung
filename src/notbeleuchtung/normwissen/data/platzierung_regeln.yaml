# ── Hard Stops: unübersteuerbar, schlagen auch LB-explizit ─────────────────
hard_stops:

  - id: HS-01-MONTAGEHOEHE
    regel: "Notleuchten und Rettungszeichen mindestens 2000 mm über dem Boden."
    wert_ref: "en1838_grundwerte::montagehoehe_min_mm"
    quelle: "EN 1838 §4.1.1"
    norm_ref: "ÖNORM EN 1838:2013 §4.1.1, S.10"
    beleg: BELEGT
    verletzung: "Platzierung unterhalb 2000 mm ist unzulässig — Fehler, kein Warnhinweis."

  - id: HS-02-BETRIEBSDAUER
    regel: "Notbetriebsdauer mindestens 60 Minuten."
    wert_ref: "en1838_grundwerte::dauer_min"
    quelle: "EN 1838 §4.2.5 / §4.3.5 / §5.4.5"
    norm_ref: "ÖNORM EN 1838:2013 §4.2.5, S.12"
    beleg: BELEGT
    verletzung: "Eine LB-Vorgabe unter 60 min unterschreitet die Norm — REVIEW, nicht übernehmen."

  - id: HS-03-LB-EXKLUSION-GEGEN-PFLICHT
    regel: >
      Eine LB-Exklusion darf eine normativ geforderte Sicherheitsbeleuchtung nicht
      abschalten. Schließt die LB einen Bereich aus, für den der OIB-Befund
      Sicherheitsbeleuchtung als erforderlich ausweist, ist das ein KONFLIKT.
    aufloesung: "REVIEW — weder still der LB folgen noch still platzieren. Beide Aussagen mit Fundstelle im Bericht zeigen."
    quelle: "CLAUDE.md („OVE/EN-Verbote sind Hard Stops\") + OIB-Resolver (normwissen/oib)"
    norm_ref: "OIB-RL 2 Punkt 5.4 + Tabelle 6"
    beleg: AUSLEGUNG
    verletzung: "Stiller Verzicht auf eine normativ geforderte Leuchte."
    hinweis: >
      Der OIB-Resolver gibt `nicht_erforderlich` NIE aus (fail closed). Ein fehlender
      OIB-Befund ist deshalb KEIN Freibrief für die LB-Exklusion — er ist ein
      Review-Fall.

  - id: HS-04-KEINE-GERATENE-RICHTUNG
    regel: "Ein Rettungszeichen ohne bestimmbare Fluchtrichtung wird nicht gesetzt."
    aufloesung: "REVIEW. Ein falsch weisender Pfeil ist schlechter als kein Pfeil."
    quelle: "Fail-Closed-Prinzip (CLAUDE.md)"
    norm_ref: "—"
    beleg: AUSLEGUNG
    verletzung: "Pfeilrichtung geraten, statt Review zu melden."
