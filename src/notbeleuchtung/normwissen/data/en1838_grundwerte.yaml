# ═══════════════════════════════════════════════════════════════════════════
# en1838_grundwerte.yaml — Norm-Grundwerte Notbeleuchtung (ÖNORM EN 1838:2013)
# ═══════════════════════════════════════════════════════════════════════════
#
# Kuratiert aus _port_source/emergency_lighting_en1838.yaml — NUR die Werte, die
# die Notbeleuchtungs-Engine braucht (nicht 1:1 die Norm-Extraktion). Glare-cd-
# Tabelle und Ra/Farbwiedergabe bleiben bewusst draußen (die Platzierung fragt
# sie nicht). Gleichmäßigkeit und Umschaltzeit sind seit Contract v1.1.0
# abfragbar und deshalb nachgezogen.
#
# Anhang B (A-Abweichungen) führt Frankreich, Italien, Deutschland und die
# Niederlande — für Österreich gibt es KEINE Abweichung. Die EN-Werte unten
# gelten hier also unverändert.
#
# Single Source für den En1838NormProvider — er hardcodet nichts, er liest hier.
# Jede quelle_* ist eine echte Norm-Fundstelle (Audit-Trail → NormAnforderung.quelle).
#
# BELEG-STATUS (Quellenprüfung 2026-08-30, docs/NORMQUELLEN_AT.md Abschnitt 2):
#   [BELEGT]   wörtlich in der vorliegenden EN-1838-Ausgabe nachgewiesen
#   [PRAXIS]   Fachpraxis-Wert, steht so NICHT in EN 1838
#   [ANNAHME]  Engineering-/Fixture-Übernahme, keine Norm-Deckung
#   [UNSCHARF] belegt, aber die Fundstelle im String ist zu grob
# Marker ändern keinen Wert — sie machen sichtbar, was geprüft ist.
# ═══════════════════════════════════════════════════════════════════════════

# [UNSCHARF] Ausgabe-Bezeichnung: im Repo liegt ÖNORM EN 1838:2019-11-15
# (IDT mit EN 1838:2013-07, Ersatz für 2013-09) — die hier genannte Ausgabe
# 2013 liegt NICHT vor. Inhaltlich deckungsgleich, nur die Bezeichnung ist alt.
# Bewusst NICHT umgestellt: der String ist Naht-Invariante und hängt an
# tests/fixtures/* (3-Owner), tests/fakes.py, einer Leonis-Assertion und dem
# Contract-Default in norm_regelwerk.py → eigener koordinierter Slice.
# Blast-Radius-Tabelle: docs/NORMQUELLEN_AT.md Abschnitt 2a.
norm: "ÖNORM EN 1838:2013"

# [BELEGT] §4.1.1, Norm-S.8 — Leuchten mind. 2 m über Boden.
# Achtung: Normwortlaut ist ein Erfüllungs-Kriterium, kein absolutes Minimum —
# „Hard Floor" ist strenger als die Norm (bewusst konservativ).
montagehoehe_min_mm: 2000

# [BELEGT] §4.2.5 / §4.3.5 / §5.4.5 — Notbetriebsdauer mind. 1 Stunde.
dauer_min: 60

# §5.5, Norm-S.13 — Erkennungsweite l = z * h. z = Faktor, h = Piktogramm-Höhe [m].
erkennungsweite:
  z_hinterleuchtet: 200.0            # [BELEGT] §5.5, wörtlich
  z_beleuchtet: 100.0                # [BELEGT] §5.5, wörtlich
  # [PRAXIS] steht nicht in EN 1838; Standard-RZ 150 mm aus
  # _port_source/rz_coverage_oenorm.yaml → l = 200·0,15 = 30 m
  piktogramm_hoehe_default_m: 0.15

# Horizontale Beleuchtungsstärke am Boden.
lux:
  # [BELEGT] §4.2.1, Norm-S.9 — Mittellinie Rettungsweg. Gebunden an Wegbreite
  # ≤ 2 m + 50-%-Mittelbereich + Anhang-B-Länderabweichungen (hier nicht modelliert).
  rettungsweg: 1.0
  # [BELEGT] §4.3.1, Norm-S.11 — freie Bodenfläche im Kernbereich
  # (Randstreifen 0,5 m ausgenommen; Randbereich hier nicht modelliert).
  antipanik: 0.5

# Ungleichmäßigkeit Ud = kleinste : größte Beleuchtungsstärke (EN 12665).
# Das Contract-Feld `NormAnforderung.gleichmaessigkeit_max` führt sie umgekehrt
# als max:min → hier stehen die Kehrwerte (1:40 → 40).
gleichmaessigkeit:
  # [BELEGT] §4.2.2, Norm-S.10 — „darf 1 : 40 entlang der Mittellinie des
  # Rettungsweges nicht unterschreiten".
  rettungsweg: 40.0
  # [BELEGT] §4.3.2, Norm-S.11 — „darf 1 : 40 nicht unterschreiten".
  # ACHTUNG: Antipanik hat DENSELBEN Wert wie der Rettungsweg. Die kursierende
  # Angabe „10 für Antipanik" ist falsch — die 10 stammt aus §4.4.2 (s.u.).
  antipanik: 40.0
  # [MANUELL_PRUEFEN] §4.4.2 fordert für Arbeitsplätze mit besonderer Gefährdung
  # Uo ≥ 0,1. Uo (kleinste : mittlere) ist NICHT Ud (kleinste : größte) — ein
  # anderes Maß, das nicht in dieses Feld gehört. Bewusst kein Eintrag; erst
  # modellieren, wenn der Raumtyp dafür existiert (Track C, @polatselman).

# Umschaltzeit auf die Sicherheitsstromversorgung. Die Norm ist ZWEISTUFIG; das
# Contract-Feld `NormAnforderung.umschaltzeit_max_s` ist ein Skalar und trägt
# deshalb nur den Vollwert-Zeitpunkt. Die 5-s-Halbwertstufe bleibt hier sichtbar,
# damit sie nicht verloren geht (an die 3 Owner gemeldet).
umschaltzeit:
  # [BELEGT] §4.2.6 / §4.3.6 / §5.4.6 — „50 % der geforderten Beleuchtungsstärke
  # innerhalb von 5 s und 100 % der geforderten Beleuchtungsstärke innerhalb von
  # 60 s". Gilt wortgleich für Rettungsweg, Antipanik und Sicherheitszeichen.
  vollwert_s: 60.0
  halbwert_s: 5.0     # nur Dokumentation — kein Contract-Feld
  # [BELEGT] §4.4.6 — Arbeitsplätze mit besonderer Gefährdung: dauernd vorhanden
  # oder innerhalb 0,5 s. Kein passender Raumtyp im RaumModell → Track C,
  # deshalb kein Eintrag.

# NICHT hier modelliert — Flächen-Schwellen (Contract v1.1.0
# `NormRegelwerk.flaechen_schwellen`): die kursierenden 60 m² / 8 m² stehen
# NICHT in EN 1838. Die vorliegende Ausgabe kennt überhaupt keine
# flächenbezogene Auslöse-Schwelle (die einzigen m²-Bezüge sind 2 cd/m²
# Leuchtdichte in §5.4.1 und eine französische A-Abweichung in Anhang B);
# §4.3.8 nennt Toiletten für Menschen mit Behinderung OHNE Flächenmaß.
# Belegt sind die Werte in
# OVE E 8101:2019 718.560.9.001.AT und ÖVE/ÖNORM E 8002-1 — dort aber
# SCOPE-GEBUNDEN (nur bei erhöhten Anforderungen nach der Art der Nutzung bzw.
# nur für Flughäfen/Bahnhöfe). Das Contract-Feld wirkt dagegen global.
# Bis zur 3-Owner-Entscheidung über ein Scope-Gate bleiben beide Felder leer
# (= None = inert). Details: docs/NORMQUELLEN_AT.md Abschnitt 2b.

# Norm-Fundstellen (kommen als NormAnforderung.quelle in den Audit-Trail).
quellen:
  rettungsweg: "ÖNORM EN 1838:2013 §4.2.1"      # [BELEGT]
  antipanik: "ÖNORM EN 1838:2013 §4.3.1"        # [BELEGT]
  # [UNSCHARF] §4.1 — Sicherheitsleuchten (Aufheller) an Betonungspunkten:
  # Stiegen, Richtungsänderungen, Ausgänge. Gestützt ist §4.1.2 b) („nahe
  # Treppen, um jede Treppenstufe direkt zu beleuchten"); „§4.1" ist zu grob.
  # Schärfung gemeinsam mit der Ausgabe-Umstellung (gleicher Blast-Radius).
  sicherheitsleuchte: "ÖNORM EN 1838:2013 §4.1"
