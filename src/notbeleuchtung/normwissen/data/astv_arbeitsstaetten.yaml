# ═══════════════════════════════════════════════════════════════════════════
# astv_arbeitsstaetten.yaml — Arbeitsstaetten-Pfad: AStV § 9 (Ebene A) und
# OVE-Fachinformation E08 (Ebene D)
# ═══════════════════════════════════════════════════════════════════════════
#
# WOFUER: Der AStV-Parallelpfad war bisher nur ein Satz ("kann zusaetzliche
# Anforderungen begruenden"). Diese Datei fuehrt die drei Tatbestaende des
# § 9 Abs. 1, das Wahlrecht des Abs. 4, die Reichweite nach § 1 und die
# Ausfuehrungsdetails der OVE-Fachinformation E08 EINZELN, je mit Fundstelle,
# benoetigter Projektangabe und Ebene.
#
# WAS SIE NICHT TUT: Sie aktiviert nichts. Kein Contract-Wert, keine Schwelle,
# keine Platzierung, keine Stufe. Jeder Eintrag ist entweder ein PRUEFPUNKT
# (Frage an das Projekt) oder eine AUSFUEHRUNGSANGABE (Ebene D). Ohne die
# genannte Projektangabe bleibt der Punkt `ungeprueft` — nie still erfuellt und
# nie still "nicht erforderlich".
#
# EBENEN (docs/NORMQUELLEN_AT.md):
#   A = amtliche Rechtsquelle (AStV, ASchG) — verbindlich
#   C = Norm (EN 1838)
#   D = OVE-Fachinformation — AUSLEGUNGSHILFE, ERSETZT KEINE NORM
# Ebenen werden nie vermischt: eine E08-Angabe belegt keine Rechtspflicht, und
# der Rechtstext nennt umgekehrt weder Beleuchtungsart noch Lux-Wert.
# ═══════════════════════════════════════════════════════════════════════════

meta:
  schema_version: "1.0.0"
  curated_at: "2026-09-08"
  owner: "Enis (normwissen)"
  status: >
    Nur Pruef- und Auskunftsgrundlage. Keine Platzierung, kein Contract-Wert,
    keine Schwellen-Aktivierung.

quellen:
  astv:
    ausgabe: "Arbeitsstaettenverordnung — AStV, BGBl. II Nr. 368/1998, Fassung vom 06.09.2026 (RIS, konsolidiert)"
    aenderungen: "BGBl. II Nr. 256/2009 · BGBl. II Nr. 324/2014 · BGBl. II Nr. 309/2017"
    ebene: "A"
    ausdruck: "knowledge/Oesterreichische Rechtsquelle/RIS_AStV_geltende_Fassung_2026-09-06.pdf"
    hinweis: >
      Der amtliche Ausdruck liegt auf dem Branch enis/sanitaer-beleuchtungsart-0906
      (Commit ee55445), nicht auf jedem Arbeitsbranch. Der Wortlaut der hier
      gefuehrten Stellen ist gegen diesen Ausdruck geprueft.
  e08:
    ausgabe: "OVE-Fachinformation E08:2021-04-01 — Arbeitsstaetten: Ausfuehrung von Sicherheitsbeleuchtung und nachleuchtenden Orientierungshilfen"
    ebene: "D"
    ausdruck: "knowledge/OVE-Fachinformation/Fachinfo_E-08_Sicherheitsbeleuchtung_Arbeitsstaetten_2021-04.pdf"
    hinweis: >
      Fachinformation = Auslegungshilfe des OVE, ERSETZT KEINE NORM und begruendet
      keine Rechtspflicht. E08 Abschnitt 1 nennt als massgebliche Regeln der
      Technik OVE E 8101 (5-56, 7-718), OVE-Richtlinie R 12-2 sowie OIB-RL 2 samt
      Erlaeuterungen und legt eigene Ausfuehrungsdetails NUR fest, wo diese
      Regelwerke keine Anforderung enthalten.
  en1838:
    ausgabe: "OENORM EN 1838:2019-11-15 (IDT EN 1838:2013-07)"
    ebene: "C"

# ── § 9 Abs. 1 — die drei Tatbestaende, GETRENNT ──────────────────────────
# Sie sind NICHT ineinander ueberfuehrbar: Z1 ist eine Bau-/Erkennungstatsache,
# Z2 eine Beurteilung, Z3 eine Gefaehrdungsbeurteilung.
tatbestaende:
  - kennung: z1_nicht_natuerlich_belichtet
    ebene: "A"
    fundstelle: "AStV § 9 Abs. 1 Z 1"
    wortlaut: "Arbeitsraeume und Fluchtwege, die nicht natuerlich belichtet sind"
    gilt_fuer: ["arbeitsraum", "fluchtweg"]
    folge_wenn_erfuellt: "Sicherheitsbeleuchtung erforderlich (Art und Lux nennt § 9 nicht)"
    benoetigte_angabe:
      - "je Raum/Abschnitt: natuerlich belichtet ja/nein (Belichtungsflaeche wie Fenster oder Lichtkuppel vorhanden)"
      - "je Raum: ist es ein Arbeitsraum i.S.d. § 1 Abs. 4 AStV (mindestens ein staendiger Arbeitsplatz)"
    heute_im_modell: false
    status: ungeprueft
    hinweis_ausgabe: >
      AStV § 9 Abs. 1 Z 1 (nicht natuerlich belichtete Arbeitsraeume und
      Fluchtwege) ist fuer dieses Projekt NICHT ausgewertet: weder die
      natuerliche Belichtung noch die Arbeitsraum-Eigenschaft ist ein Eingang
      dieser Engine.
    abgrenzung: >
      Fehlende Belichtung allein macht einen Raum nicht zum Arbeitsraum. Z 1
      setzt "Arbeitsraeume UND Fluchtwege" voraus — beide Eigenschaften sind
      getrennt festzustellen (§ 1 Abs. 4 knuepft an einen staendigen
      Arbeitsplatz an).

  - kennung: z2_belichtung_reicht_nicht_aus
    ebene: "A"
    fundstelle: "AStV § 9 Abs. 1 Z 2"
    wortlaut: >
      Fluchtwege, die zwar natuerlich belichtet sind, diese natuerliche
      Belichtung jedoch zB auf Grund der baulichen Gegebenheiten oder auf Grund
      der Lage der Arbeitszeit nicht ausreicht, um bei Ausfall der kuenstlichen
      Beleuchtung das rasche und gefahrlose Verlassen der Arbeitsstaette zu
      ermoeglichen
    gilt_fuer: ["fluchtweg"]
    folge_wenn_erfuellt: "Sicherheitsbeleuchtung erforderlich"
    benoetigte_angabe:
      - "Beurteilung je Fluchtweg-Abschnitt: reicht die natuerliche Belichtung bei Ausfall der kuenstlichen Beleuchtung aus (ja/nein/nicht beurteilt) — mit Begruendung"
    heute_im_modell: false
    status: ungeprueft
    hinweis_ausgabe: >
      AStV § 9 Abs. 1 Z 2 (natuerlich belichteter Fluchtweg, dessen Belichtung
      bei Ausfall der kuenstlichen Beleuchtung nicht ausreicht) ist eine
      BEURTEILUNG des Projekts und hier nicht getroffen.
    abgrenzung: >
      ⚠️ Z 2 gilt ausschliesslich fuer FLUCHTWEGE — nicht fuer Arbeitsraeume.
      Der Wortlaut nennt nur Fluchtwege; die Ausdehnung auf Arbeitsraeume waere
      unbelegte Auslegung. Z 2 ist ausserdem NICHT aus Z 1 ableitbar: Z 1 fragt,
      OB natuerlich belichtet wird, Z 2, ob die vorhandene Belichtung im
      Ausfallfall genuegt. Die Beurteilungsgruende, die der Verordnungstext
      beispielhaft nennt ("bauliche Gegebenheiten", "Lage der Arbeitszeit"),
      sind keine Geometrie und keine Erkennungsgroesse.

  - kennung: z3_besondere_gefahr
    ebene: "A"
    fundstelle: "AStV § 9 Abs. 1 Z 3"
    wortlaut: >
      Bereiche, in denen Arbeitnehmer/innen bei Ausfall der Beleuchtung einer
      besonderen Gefahr ausgesetzt sein koennten oder in denen Einrichtungen
      bedient werden, von denen eine besondere Gefahr fuer die
      Arbeitnehmer/innen ausgeht
    gilt_fuer: ["bereich"]
    folge_wenn_erfuellt: "Sicherheitsbeleuchtung erforderlich; zusaetzlich sperrt Z 3 das Wahlrecht nach Abs. 4"
    benoetigte_angabe:
      - "Gefahrenbeurteilung je Bereich: Bereich nach § 9 Abs. 1 Z 3 ja/nein/nicht beurteilt"
    heute_im_modell: false
    status: ungeprueft
    hinweis_ausgabe: >
      AStV § 9 Abs. 1 Z 3 (Bereiche mit besonderer Gefahr bei Ausfall der
      Beleuchtung) ist eine Gefahrenbeurteilung des Projekts und hier nicht
      getroffen.
    abgrenzung: >
      ⚠️ NICHT gleichzusetzen mit `RaumModell.Raum.besondere_gefaehrdung`. Das
      Contract-Feld traegt EN 1838 § 4.4 ("Arbeitsplaetze mit besonderer
      Gefaehrdung", Lux-Anforderung auf der Arbeitsflaeche); AStV Z 3 ist ein
      Erforderlichkeits-Tatbestand fuer BEREICHE und entscheidet zusaetzlich
      ueber das Wahlrecht nach Abs. 4. Beide koennen zusammenfallen — belegt ist
      das nicht. Eine stillschweigende Gleichsetzung wuerde aus einem gesetzten
      Lux-Attribut eine Rechtsfolge machen.

# ── § 9 Abs. 4 — zulaessige Ausfuehrungswahl ──────────────────────────────
wahlrecht_abs4:
  ebene: "A"
  fundstelle: "AStV § 9 Abs. 4"
  wortlaut: >
    Sofern sich in Arbeitsraeumen oder auf Fluchtwegen keine Bereiche im Sinne
    des Abs. 1 Z 3 befinden, sind abweichend von Abs. 1 Z 1 und 2 anstelle der
    Sicherheitsbeleuchtung selbst- oder nachleuchtende Orientierungshilfen, die
    bei Ausfall der Beleuchtung ein sicheres Verlassen der Arbeitsstaette
    gewaehrleisten, zulaessig. In diesem Fall gelten Abs. 2 und Abs. 3 Z 1 fuer
    die Orientierungshilfen.
  art: wahlrecht
  entscheider: "Planer/Auftraggeber (bzw. LB) — NICHT die Engine"
  bedingungen:
    - "kein Bereich nach Abs. 1 Z 3 in den betroffenen Arbeitsraeumen oder Fluchtwegen"
    - "die Orientierungshilfen gewaehrleisten ein sicheres Verlassen der Arbeitsstaette"
    - "Abs. 2 (unabhaengige Energieversorgung, selbsttaetiges Wirksamwerden) und Abs. 3 Z 1 gelten auch fuer sie"
  reichweite: >
    ⚠️ Die Ausnahme wirkt AUSDRUECKLICH nur "abweichend von Abs. 1 Z 1 und 2" —
    also nur innerhalb der AStV und nur fuer diese beiden Tatbestaende. Sie
    ersetzt KEINE Anforderung aus anderen Quellen: nicht OVE E 8101
    718.560.9.001.AT, nicht OVE-Richtlinie R 12-2 Tabelle 5.1, nicht OIB-RL 2
    Tabelle 6. Fuer Z 3 gilt sie nie.
  benoetigte_angabe:
    - "Projekt-/LB-Entscheidung: nachleuchtende Orientierungshilfen statt Sicherheitsbeleuchtung ja/nein/nicht entschieden"
  heute_im_modell: false
  status: ungeprueft
  hinweis_ausgabe: >
    AStV § 9 Abs. 4 laesst unter engen Bedingungen selbst- oder nachleuchtende
    Orientierungshilfen anstelle der Sicherheitsbeleuchtung zu (nur ohne
    Bereiche nach Abs. 1 Z 3, nur abweichend von Abs. 1 Z 1 und 2). Diese Wahl
    trifft der Planer bzw. der Auftraggeber, nicht diese Engine; sie ist fuer
    dieses Projekt nicht angegeben und wird hier weder unterstellt noch
    ausgeschlossen.

# ── § 1 — Reichweite (Anwendungsbereich) ──────────────────────────────────
reichweite:
  ebene: "A"
  fundstellen:
    abs1: "AStV § 1 Abs. 1 — gilt fuer Arbeitsstaetten i.S.d. § 19 ASchG"
    abs2: "AStV § 1 Abs. 2 — Arbeitsstaette als Teilbereich eines Gebaeudes: auch die ausserhalb gelegenen, von Arbeitnehmer/innen benutzten Gebaeudeteile muessen dem 1. und 2. Abschnitt entsprechen"
    abs3: "AStV § 1 Abs. 3 — Abs. 2 gilt nicht fuer Gebaeudeteile, die auch von Hausbewohner/innen benutzt werden, sofern das Gebaeude ueberwiegend zu Wohnzwecken vorgesehen ist; bei befuerchteter Gefaehrdung schreibt die Behoerde Massnahmen nach § 94 ASchG vor"
    abs4: "AStV § 1 Abs. 4 — Arbeitsraum = Raum mit mindestens einem staendigen Arbeitsplatz"
  bedingungen_abs3_kumulativ:
    - "die Arbeitsstaette umfasst nur einen Teilbereich des Gebaeudes"
    - "der Gebaeudeteil liegt ausserhalb der Arbeitsstaette"
    - "er wird auch von Hausbewohner/innen benutzt"
    - "das Gebaeude ist ueberwiegend zu Wohnzwecken vorgesehen"
  klarstellungen:
    - "§ 1 Abs. 3 setzt AUSSCHLIESSLICH Abs. 2 ausser Kraft — kein pauschaler Ausschluss der AStV fuer Wohngebaeude. § 1 Abs. 1 bleibt unberuehrt; innerhalb der Arbeitsstaette gilt § 9 unveraendert."
    - "§ 9 steht im 1. Abschnitt — also in einem der beiden Abschnitte, auf die Abs. 2 verweist. Die Freistellung trifft die Sicherheitsbeleuchtung der geteilten Gebaeudeteile daher tatsaechlich."
    - "Auch dort keine Freistellung ohne Rest: Satz 2 haelt den Behoerdenpfad nach § 94 ASchG offen. Ein 'hier ist nichts erforderlich' folgt daraus nicht."
  benoetigte_angabe:
    - "je Gebaeudeteil: Arbeitsstaette nach ASchG ja/nein/unbekannt (existiert als ProjektKontext.Gebaeudeteil.arbeitsstaette_nach_aschg)"
    - "je Raum: liegt er innerhalb der Arbeitsstaette, oder ist er ein von Arbeitnehmer/innen mitbenutzter Gebaeudeteil ausserhalb"
    - "wird der Gebaeudeteil auch von Hausbewohner/innen benutzt"
    - "ist das Gebaeude ueberwiegend zu Wohnzwecken vorgesehen"
  heute_im_modell: teilweise    # nur arbeitsstaette_nach_aschg je Gebaeudeteil
  status: ungeprueft

# ── OVE-Fachinformation E08 — Ausfuehrungsdetails (Ebene D) ───────────────
# Diese Angaben sind AUSLEGUNG, keine Rechtspflicht. Sie stehen hier, damit die
# Ausgabe sagen kann, WORAN eine AStV-konforme Ausfuehrung gemessen wird — nicht,
# damit die Engine sie selbst entscheidet.
ausfuehrung_e08:
  - kennung: e08_tabelle1_arbeitsraeume
    fundstelle: "OVE-Fachinformation E08:2021-04-01, Abschnitt 3, Tabelle 1 (S. 3)"
    art: empfehlung
    gegenstand: "Ausstattung von Arbeitsraeumen, abhaengig von Raumgroesse und natuerlicher Belichtung"
    tabelle:
      - flaeche_m2: "< 30"
        mit_natuerlichem_licht: "keine Angabe"
        ohne_natuerliche_belichtung: "nachleuchtende Orientierungshilfen"
      - flaeche_m2: "30 bis 100"
        mit_natuerlichem_licht: "nachleuchtende Orientierungshilfen"
        ohne_natuerliche_belichtung: "Sicherheitsleuchten"
      - flaeche_m2: "> 100 bis 1600"
        mit_natuerlichem_licht: "nachleuchtende Orientierungshilfen und/oder Sicherheitsleuchten (Fussnote a)"
        ohne_natuerliche_belichtung: "Sicherheitsleuchten"
      - flaeche_m2: "> 1600"
        mit_natuerlichem_licht: "Sicherheitsleuchten"
        ohne_natuerliche_belichtung: "Sicherheitsleuchten"
    fussnote_a: >
      Ob nachleuchtende Orientierungshilfen oder Sicherheitsleuchten auszufuehren
      sind, muss aufgrund der oertlichen Gegebenheiten im Einzelfall, im Zuge der
      Gefahrenbeurteilung, festgelegt werden. Im Zweifelsfall sind
      Sicherheitsleuchten auszufuehren.
    benoetigte_angabe:
      - "je Raum: Arbeitsraum ja/nein"
      - "je Raum: natuerlich belichtet ja/nein"
      - "je Raum: Flaeche in m² (aus der Raumkontur ableitbar)"
    heute_im_modell: false
    status: nicht_aktiv
    grenze: >
      ⚠️ Empfehlung einer Fachinformation, keine Rechtspflicht und keine Norm.
      Die Zeile "< 30 m² mit natuerlichem Licht" ist in der Quelle LEER — das ist
      Schweigen, kein "nicht erforderlich".

  - kennung: e08_fluchtweg_zu_beleuchtende_stellen
    fundstelle: "OVE-Fachinformation E08:2021-04-01, Abschnitt 4 (S. 3-4)"
    art: aufzaehlung
    gegenstand: "zu beleuchtende Stellen im Verlauf von Fluchtwegen"
    stellen:
      - "jeder Ausgang und jede Tuere im Verlauf eines Fluchtweges"
      - "nahe Treppen, um die Treppenstufen zu beleuchten"
      - "nahe jeder anderen Niveauaenderung"
      - "bei jeder Richtungsaenderung oder Kreuzung"
      - "der Bereich unmittelbar nach dem Ausgang ins Freie"
    verhaeltnis_zu_en1838: >
      Deckt sich der Sache nach mit EN 1838 § 4.1.2; E08 verweist fuer die
      Sicherheitszeichen ausdruecklich auf OENORM EN 1838. Diese Aufzaehlung ist
      damit eine BESTAETIGUNG auf Ebene D, KEINE zusaetzliche Rechtsgrundlage —
      die Sonderstellen der Engine bleiben auf EN 1838 gestuetzt.
    heute_im_modell: true       # als EN-1838-Sonderstellen, nicht als E08-Regel
    status: bestaetigend

  - kennung: e08_anlagenanforderungen
    fundstelle: "OVE-Fachinformation E08:2021-04-01, Abschnitt 5.1/5.2 (S. 4-5)"
    art: ausfuehrung
    angaben:
      - "Kennzeichnung des Fluchtwegverlaufs bis in das sichere Freie sicherstellen"
      - "Erkennungsweiten gemaess OENORM EN 1838 einhalten"
      - "Rettungszeichen nach Kennzeichnungsverordnung (KennV); Kennzeichnung nach EN ISO 7010 ebenfalls zulaessig"
      - "bei Ausfall der allgemeinen Beleuchtung 50 % innerhalb von 5 s, 100 % innerhalb von 60 s der geforderten Mindestbeleuchtungsstaerke"
      - "Bemessungsbetriebsdauer der Sicherheitsstromquelle mindestens 60 Minuten"
      - "als ausreichende Mindestbeleuchtungsstaerke ist in der Regel 1 lx anzusehen"
      - "mehr als 20 Sicherheitsleuchten in einem zusammenhaengenden Gebaeudeteil: automatische Pruefeinrichtung mit zentraler Erfassung nach OEVE/OENORM EN 62034"
      - "LPS-/CPS-Systeme: Aufteilung der Fluchtweg-Sicherheitsleuchten alternierend auf mindestens 2 Stromkreise; je Endstromkreis hoechstens 20 Leuchten"
    deckung_mit_engine:
      umschaltzeit: "deckungsgleich mit EN 1838 § 4.2.6/§ 4.3.6 (5 s / 60 s) — bereits in en1838_grundwerte.yaml"
      dauer_min: "deckungsgleich mit dem Contract-Default dauer_min = 60"
      mindestbeleuchtungsstaerke: "deckungsgleich mit EN 1838 § 4.2.1 (1 lx) — E08 formuliert es als Regelfall"
      pruefeinrichtung_ab_20_leuchten: "NICHT abgebildet — E08 5.2 (Ebene D): MEHR ALS 20 Sicherheitsleuchten IN EINEM ZUSAMMENHAENGENDEN GEBAEUDETEIL verlangen eine automatische Pruefeinrichtung mit zentraler Erfassung nach OEVE/OENORM EN 62034. Bezugsgroesse ist der Gebaeudeteil, die Rechtsfolge die Anlagenueberwachung."
      stromkreis_aufteilung: "NICHT abgebildet — E08 5.2 (Ebene D) fuer LPS-/CPS-Systeme: alternierende Aufteilung auf mindestens 2 Stromkreise und hoechstens 20 Leuchten JE ENDSTROMKREIS. Die 20-Leuchten-Grenze je Endstromkreis steht zusaetzlich normativ in OVE E 8101 560.9.2 (Ebene C, mit 60-%-Belastungsgrenze) — das ist eine ANDERE Aussage als die Pruefeinrichtung oben."
      ⚠_zwei_mal_die_zahl_20: "Die Pruefeinrichtung (je zusammenhaengendem Gebaeudeteil) und die Stromkreisgrenze (je Endstromkreis) sind getrennt zu fuehren. Die E-8101-Fundstelle belegt nur die Stromkreisgrenze, nicht die Pruefeinrichtung; fuer diese ist E08 5.2 die einzige vorliegende Quelle — und sie ist Ebene D."
    heute_im_modell: teilweise
    status: teils_bestaetigend_teils_offen

  - kennung: e08_besondere_gefaehrdung_lux
    fundstelle: "OVE-Fachinformation E08:2021-04-01, Abschnitt 5.3 (S. 5)"
    art: ausfuehrung
    angaben:
      - "geforderte Beleuchtungsstaerke dauernd vorhanden oder innerhalb von 0,5 s erreicht"
      - "Bemessungsbetriebsdauer nach der Dauer der bestehenden Gefaehrdung"
      - "Beleuchtungsstaerke im Bereich der besonderen Gefaehrdung mindestens 10 % der Beleuchtungsstaerke der ALLGEMEINBELEUCHTUNG am Arbeitsplatz, jedoch mindestens 15 lx"
    verhaeltnis_zu_en1838: >
      ⚠️ Die absolute Untergrenze 15 lx ist in beiden Quellen gleich (EN 1838
      § 4.4.1: "mindestens 10 % des fuer die Aufgabe erforderlichen
      Wartungswertes der Beleuchtungsstaerke ... darf nicht unter 15 lx fallen").
      Die BEZUGSGROESSE der Prozentangabe ist jedoch NICHT dieselbe: EN 1838
      bezieht sich auf den Wartungswert der AUFGABENbeleuchtung, E08 auf die
      ALLGEMEINbeleuchtung am Arbeitsplatz. Beide duerfen nicht gleichgesetzt
      werden. Ebenso deckungsgleich: 0,5 s (EN 1838 § 4.4.6) und die
      gefaehrdungsabhaengige Betriebsdauer (EN 1838 § 4.4.5).
    warum_kein_contract_wert: >
      `NormRegelwerk.arbeitsplatz_lux` bleibt LEER. Nicht, weil der Wert fehlte —
      15 lx ist belegt —, sondern weil die BEZUGSFLAECHE fehlt: EN 1838 § 4.4.1
      misst auf der ARBEITSFLAECHE, und weder die Arbeitsflaeche noch der
      Wartungswert der Aufgabenbeleuchtung sind Eingaenge dieser Engine. Ein
      gefuellter Skalar wuerde von den Konsumenten auf den Bodenwert aus
      `lux_raster` bezogen — eine andere Bezugsflaeche. Der Nachweis bleibt
      deshalb `MANUELL PRUEFEN` (Pruefregel in hauptengine/validierung.py).
    heute_im_modell: false
    status: belegt_aber_nicht_aktivierbar

# ── Die zwei Aussagen mit der Zahl 20, je mit Anwendungsbereich ───────────
zwanzig_leuchten:
  a_endstromkreis:
    fundstelle: "OVE E 8101, Teil 5-56, 560.9.2 (Ausgabe 2019-01-01 und 2025-10-01, Wortlaut am Volltext geprueft)"
    ebene: "C"
    bezugseinheit: "Endstromkreis"
    gezaehlt_wird: "Leuchten, die von EINEM Endstromkreis gespeist werden"
    aussage: >
      Von einem Endstromkreis duerfen nicht mehr als 20 Leuchten mit einer
      Gesamtbelastung von nicht mehr als 60 % des Nennstromes der
      Ueberstrom-Schutzeinrichtung gespeist werden; bei alternierender Aufteilung
      muss ein Kurzschluss in einem Stromkreis die Versorgung benachbarter
      Leuchten nicht unterbrechen koennen.
    anwendungsbereich: "jede Sicherheitsbeleuchtungsanlage mit Endstromkreisen"
    heute_pruefbar: false
    grund: "Die Engine fuehrt keine Stromkreise; `Platzierung.circuit_hint` ist ein Freitext-Hinweis, keine Stromkreis-Zuordnung."

  b_automatische_pruefeinrichtung:
    # ⚠️ KORREKTUR 2026-09-08: frueher hier als "nur Ebene D (E08)" gefuehrt.
    # Falsch — die Anforderung steht NORMATIV in OVE E 8101, in BEIDEN Ausgaben.
    fundstelle_norm: "OVE E 8101, Teil 5-56, 560.9.001.AT — Ausgabe 2019-01-01 UND Ausgabe 2025-10-01, Wortlaut am Volltext geprueft"
    ebene: "C"
    fundstelle_fachinformation: "OVE-Fachinformation E08:2021-04-01, Abschnitt 5.2 — wiederholt die Anforderung (Ebene D), begruendet sie nicht"
    bezugseinheit: "zusammenhaengender Gebaeudeteil"
    gezaehlt_wird: "Sicherheitsleuchten in diesem Gebaeudeteil"
    wortlaut: >
      Bei mehr als 20 Sicherheitsleuchten in einem zusammenhaengenden Gebaeudeteil
      ist eine automatische Pruefeinrichtung mit zentraler
      Erfassung/Registrierung gemaess OEVE/OENORM EN 62034 vorzusehen.
    zusatzanforderungen_2025:
      - "a) Ueberwachung der Ladung (bei Batterieanlagen): kontinuierlich oder periodisch in Zeitabstaenden kuerzer als 5 min"
      - "b) Ueberwachung der Funktionsfaehigkeit der Sicherheitsleuchten; Fehleranzeige bereits beim Ausfall EINER Leuchte; Pruefzyklus taeglich; Pruefdauer hoechstens 5 min"
      - "c) Ueberwachung des Uebertragungsweges; das Ergebnis muss angezeigt, gemeldet und protokolliert werden"
    unterschied_2019_zu_2025: >
      Die Kernaussage (mehr als 20 Sicherheitsleuchten je zusammenhaengendem
      Gebaeudeteil) ist in beiden Ausgaben WORTGLEICH. Unterschiede nur in den
      Unterpunkten: 2019 nennt b) "zyklische Ueberwachung der Funktionsfaehigkeit
      der angeschlossenen Verbraucher" mit einer Pruefdauer "zwischen 0,5 min und
      5 min"; 2025 formuliert b) auf die Sicherheitsleuchten um und nennt nur
      "hoechstens 5 min" (keine Untergrenze). 2019 c) ist eine Fehlermeldung bei
      Fehlern auf dem Uebertragungsweg, 2025 c) die Ueberwachung des
      Uebertragungsweges samt Anzeige-, Melde- und Protokollpflicht. 2025
      praezisiert a) auf Batterieanlagen.
    ⚠_begriffsgrenze: >
      "Zusammenhaengender Gebaeudeteil" ist in OVE E 8101 nicht definiert (im
      Volltext 2025 kommt der Ausdruck nur an dieser einen Stelle vor, Teil 2
      "Begriffe" fuehrt ihn nicht); auch E08 definiert ihn nicht.
      ⚠️ Daraus folgt NICHT, dass die Regel unumsetzbar waere. Es fehlen genau
      zwei Angaben, beide projektseitig beschaffbar:
      (1) die FACHLICHE ABGRENZUNG, welche Bereiche im konkreten Projekt einen
          zusammenhaengenden Gebaeudeteil bilden — eine Festlegung des
          Brandschutzkonzepts bzw. des Planers, nicht der Norm;
      (2) die ZUORDNUNG jeder Sicherheitsleuchte zu dieser Abgrenzung — heute
          nicht vorhanden, weil `Platzierung` weder `raum_id` noch
          `gebaeudeteil_id` traegt.
      Liegen beide vor, ist die Regel exakt auswertbar.
    ⚠_nebenfundstelle: >
      In der Ausgabe 2025 taucht 560.9.001.AT zusaetzlich in der Legende zu den
      Bildern der Nationalen Ergaenzung 710.NE2 (Teil 7-710, medizinisch genutzte
      Bereiche) als Zeile 13 auf, neben Zeile 12 "Sicherheitsbeleuchtung gemaess
      560.9 (mehr als 20 Sicherheitsleuchten in einem zusammenhaengenden
      Gebaeudeteil)". Das ist ein VERWEIS in einer Bildlegende, keine zweite oder
      abweichende Anforderung.
    heute_pruefbar: teilweise
    grund: >
      Der Schwellenwert ist belegt und die Leuchtenzahl liegt im
      PlatzierungsErgebnis vor — die BEZUGSEINHEIT aber nicht: `Platzierung`
      traegt weder `raum_id` noch `gebaeudeteil_id` (geprueft an origin/main
      4c5df91), und "zusammenhaengender Gebaeudeteil" ist ohnehin undefiniert.

  vorhandener_verbraucher:
    # ⚠️ KORREKTUR 2026-09-08: es gibt bereits einen Konsumenten in der Engine.
    # Dieser Block beschreibt ihn — er begruendet KEINE zweite Regel daneben.
    stelle: "hauptengine/pipeline.py::_coverage, Konstante `_AUTO_PRUEF_SCHWELLE = 20`"
    owner: "Leonis (hauptengine) — NICHT von Enis geaendert"
    verhalten: >
      Ist `len(platzierung.platzierungen) > 20`, haengt `_coverage` einen
      nicht-blockierenden Hinweis an: "<n> Sicherheitsleuchten (> 20) →
      automatische Pruefeinrichtung mit zentraler Erfassung erforderlich
      (OVE E 8101 560.9.001.AT / EN 62034)". Der Hinweis erreicht ueber
      `render_summary` auch den API-Header.
    quelle_korrekt: true
    einstufung: vorlaeufiger_hinweis
    zwei_zaehlungen_die_nicht_dasselbe_sind:
      geschosszaehlung_heute: >
        Gezaehlt wird `len(platzierung.platzierungen)` — alle Platzierungen EINES
        GESCHOSSES, einschliesslich Rettungszeichen. Das ist eine Groesse des
        Plans, nicht der Norm.
      gebaeudeteilzaehlung_der_norm: >
        560.9.001.AT zaehlt SICHERHEITSLEUCHTEN in einem ZUSAMMENHAENGENDEN
        GEBAEUDETEIL. Ein Gebaeudeteil kann mehrere Geschosse umfassen (die
        Geschosszaehlung liegt dann zu niedrig) und ein Geschoss mehrere
        Gebaeudeteile (dann zu hoch).
      ⚠_kein_ersatz: >
        Die Geschosszaehlung ist KEIN Nachweis fuer die Gebaeudeteilzaehlung —
        auch nicht mit einem erlaeuternden Halbsatz. Ein Zusatz wie "gezaehlt je
        Geschoss" macht den Hinweis ehrlich, aber nicht belastbar.
    ⚠_keine_schlussfolgerung_aus_der_geschosszahl:
      - "Ueber 20 im Geschoss begruendet KEINE abschliessende Pflicht — die Bezugseinheit der Norm ist nicht gezaehlt."
      - "Bis 20 im Geschoss begruendet KEINE Entwarnung — der zusammenhaengende Gebaeudeteil kann mehr Leuchten enthalten."
      - "Der Hinweis darf nicht behaupten, eine Pruefeinrichtung fehle; ob eine vorhanden ist, ist eine Anlagen-Tatsache ausserhalb des Plans."
    fehlende_angaben_fuer_einen_belastbaren_befund:
      - "fachliche Abgrenzung der zusammenhaengenden Gebaeudeteile (Projekt/Brandschutzkonzept)"
      - "Zuordnung Leuchte -> Gebaeudeteil (heute traegt `Platzierung` weder `raum_id` noch `gebaeudeteil_id`)"
      - "Klaerung, ob Rettungszeichenleuchten mitzaehlen (E08 Abschnitt 2 spricht dafuer, ausdruecklich belegt ist es nicht; nachleuchtende Zeichen waeren keine Sicherheitsleuchten)"
    empfehlung_an_den_owner: >
      Den vorhandenen Hinweis BEHALTEN und als VORLAEUFIG kennzeichnen — die
      Fundstelle ist richtig, er blockiert nichts, und er ist der einzige Ort,
      an dem diese Anforderung heute sichtbar wird. Er sollte sagen, was
      tatsaechlich gezaehlt wurde, dass die Norm eine andere Bezugseinheit meint
      und welche zwei Angaben fuer einen belastbaren Befund fehlen. Umsetzung und
      Wortlaut liegen bei @mvpo3; von Enis kommt keine zweite Regel daneben.

  ⚠_keine_kreuzbelege: >
    Die beiden Aussagen bleiben getrennt: 560.9.2 belegt die
    Endstromkreis-Grenze, 560.9.001.AT die Pruefeinrichtung. Keine der beiden
    belegt die andere. E08 5.2 wiederholt beide, begruendet aber keine.

