# ═══════════════════════════════════════════════════════════════════════════
#
# WOFUER: Beide Fachinformationen standen im Bestand als "nur gespeichert" bzw.
# als Digest-Eintrag ohne Originalpruefung. Hier sind sie am Original
# ausgewertet — mit ihrem Anwendungsbereich, ihrer Bezugsnorm und ihrer
# Aussagekraft.
#
# WAS SIE NICHT TUT: Sie aktiviert nichts. Beide betreffen die ANLAGENTECHNIK
# (Installation, Steuerung, Pruefung), nicht die Erforderlichkeit und nicht die
# Platzierung von Symbolen. Kein Contract-Wert, kein Provider, keine Regel.
#
# ⚠️ BEIDE SIND HISTORISCHE TEXTE MIT AKTUELLEM DECKBLATT:
#   E05 traegt "Ausgabe: 2021-01-01", ist aber die Erstveroeffentlichung aus
#   e&i 108. Jg. (1991) H.4 und laut Schlusssatz "nur gemeinsam mit
#   OEVE-EN 1 Teil 4 § 90:1991 anwendbar" — einer laengst abgeloesten Norm.
#   E06 traegt dieselbe Ausgabe, ist die "Fachinformation vom Jaenner 2009" und
#   laut Text an OEVE/OENORM E 8002-1:2007 gebunden.
#   Keine der beiden Bezugsnormen liegt im Repo.
# ═══════════════════════════════════════════════════════════════════════════

