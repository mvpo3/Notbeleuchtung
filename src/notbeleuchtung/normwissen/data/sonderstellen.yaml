# ═══════════════════════════════════════════════════════════════════════════
# sonderstellen.yaml — Typ-Katalog der hervorzuhebenden Stellen (EN 1838 §4.1.2)
# ═══════════════════════════════════════════════════════════════════════════
#
# EN 1838 §4.1.2 verlangt, dass bestimmte STELLEN hervorgehoben werden — nicht
# bestimmte Räume. Diese Stellen sind punktförmig, liegen irgendwo im Grundriss und
# haben im heutigen `RaumModell` **kein Merkmal**. Acht Regeln der
# Placement-Decision-Matrix hängen deshalb in der Luft
# (`PlatzierungsRegelwerk.blockiert_durch_contract()`).
#
# Diese Datei ist die fachliche Grundlage für einen **Contract-Vorschlag**
# (`docs/SPEC_SONDERSTELLEN_CONTRACT.md`). Sie ändert keinen Contract und schaltet
# nichts frei — sie sagt nur, WELCHE Typen es fachlich gibt, WOHER sie kommen
# könnten und WELCHE Regel jeder Typ aktivieren würde.
#
# AUFNAHME-REGEL: ein Typ steht hier nur, wenn ihn eine Regel der Matrix braucht.
# Keine hypothetischen Zukunfts-Typen. Beobachtete, aber unbenötigte Symbole stehen
# unter `beobachtet_ohne_regel`.
#
# BELEG-STATUS (Legende: en1838_grundwerte.yaml):
#   [BELEGT] wörtlich in der Norm-Extraktion · [AUSLEGUNG] norm-gestützte Zuordnung
#   [LB] aus einer realen Leistungsbeschreibung · [MANUELL_PRUEFEN] Quelle fehlt
# ═══════════════════════════════════════════════════════════════════════════

meta:
  schema_version: "1.0.0"
  curated_at: "2026-08-31"
  owner: "Enis (normwissen)"
  status: "Contract-VORSCHLAG — nicht verdrahtet, kein contract_version-Bump"
  norm_basis: "ÖNORM EN 1838:2013 §4.1.2 (S.10–11) — hervorzuhebende Stellen, max. 2 m horizontaler Abstand"
  cad_beleg: >
    Die Typ-Nomenklatur folgt den Symbolen, die ein professioneller Plan
    tatsächlich führt: `DIN-Notbeleuchtungspläne(Beispiele)/
    din_support_ReMi_Barawitzkagasse_28.04.2026.dxf` enthält die Block-Definitionen
    `din_Feuerloescher_F001`, `din_Hydrant_F002`, `din_ErsteHilfe_E003` und
    `din_Notrufstelle_E004` (Registriernummern nach ISO 7010). Die Typen sind also
    nicht erfunden, sondern in der Fachpraxis bereits benannt.
  cad_einschraenkung: >
    Dieselbe Datei ist eine SYMBOL-BIBLIOTHEK, kein bestückter Plan: 0 platzierte
    INSERTs im Modelspace. Ein bestückter Beispielplan liegt im Repo NICHT vor —
    es gibt daher keinen erprobten Parser und keinen Beleg, dass sich Positionen
    heute automatisch auslesen lassen.

# ── Warum ein Punkt-Modell und keine Raum-Flags ────────────────────────────
# Feuerlöscher, Hydrant, Erste-Hilfe-Stelle und Melder hängen an einer POSITION,
# nicht an einem Raum: die 2-m-Regel aus §4.1.2 ist ein Abstand zum Gerät. Ein
# Raum-Flag könnte sie nicht ausdrücken. Umgekehrt sind Barrierefreiheit (§4.3.8)
# und besondere Gefährdung (§4.4.1) Eigenschaften eines RAUMS bzw. einer Fläche —
# die gehören nicht in dieses Modell (siehe `raum_attribute` unten).

sonderstellen_typen:

  - typ: feuerloescher
    bezeichnung: "Feuerlöscher"
    aktiviert_regeln: [SL-06-FEUERLOESCHER]
    leuchtenart: sicherheitsleuchte
    max_horizontal_zum_punkt_mm: 2000
    # Korrektur 05.09.: der String trug die PDF-Seiten 10–11 statt der
    # NORM-Seite. §4.1.2 i) steht auf Norm-S.9 (= PDF-S.11), am Original geprueft.
    norm_ref: "ÖNORM EN 1838:2013 §4.1.2 i), S.9 (Brandbekämpfungs- und Meldeeinrichtungen)"
    beleg: BELEGT
    lux_anforderung:
      # [BELEGT] §4.1.2 i), Norm-S.9 — „nahe jeder Brandbekämpfungs- und Melde-
      # einrichtung, so dass 5 lx vertikale Beleuchtungsstärke an den Melde-, den
      # Brandbekämpfungseinrichtungen und der Anzeigen der Brandmeldeanlage
      # erreicht werden". Korrektur vom 01.09.: bis dahin war der Wert hier als
      # reiner LB-Wert geführt (docs/NORMQUELLEN_AT.md 2c).
      norm_wert: 5.0
      norm_bezugsflaeche: vertikal   # AM GERÄT, nicht horizontal am Boden
      norm_status: BELEGT
      norm_quelle: "ÖNORM EN 1838:2013 §4.1.2 i), S.9"
      # Die reale Elektro-LB nennt denselben Wert — sie wiederholt die Norm,
      # sie begründet sie nicht.
      lb_typisch: 5.0
      lb_quelle: "LBVorgabe.sonder_lux[ort=feuerloescher] — reale Elektro-LB §5.1.23"
    cad_symbol_beleg: "din_Feuerloescher_F001, FEUERLOESCHER_RZ, Feuerloescher_RZ_SYM"
    datenquellen: [elektro_lb_ohne_position, manuell, elektroplan_kuenftig]
    review_erforderlich: true      # solange der Lux-Wert unbelegt ist

  - typ: hydrant
    bezeichnung: "Wandhydrant / Löschwasserentnahme"
    aktiviert_regeln: [SL-07-WANDHYDRANT]
    leuchtenart: sicherheitsleuchte
    max_horizontal_zum_punkt_mm: 2000
    # Korrektur 05.09.: PDF-Seite → Norm-Seite, siehe feuerloescher.
    norm_ref: "ÖNORM EN 1838:2013 §4.1.2 i), S.9 (Brandbekämpfungs- und Meldeeinrichtungen)"
    # „Wandhydrant" ist die Auslegung des Norm-Oberbegriffs auf ein konkretes Gerät.
    beleg: AUSLEGUNG
    lux_anforderung:
      # [BELEGT] §4.1.2 i), Norm-S.9 — 5 lx vertikal an der Brandbekämpfungs-
      # einrichtung. Der Wert selbst ist normativ; nur die Zuordnung
      # „Wandhydrant = Brandbekämpfungseinrichtung" bleibt AUSLEGUNG (s. beleg).
      norm_wert: 5.0
      norm_bezugsflaeche: vertikal
      norm_status: BELEGT
      norm_quelle: "ÖNORM EN 1838:2013 §4.1.2 i), S.9"
      lb_typisch: 5.0
      lb_quelle: "LBVorgabe.sonder_lux[ort=hydrant] — reale Elektro-LB §5.1.23"
    cad_symbol_beleg: "din_Hydrant_F002, HYDRANT_RZ, ISO7010_RZ_Wandhydrant"
    datenquellen: [elektro_lb_ohne_position, manuell, elektroplan_kuenftig]
    review_erforderlich: true
    # Fachlich GETRENNT von feuerloescher, auch wenn die LB beide in einem Satz
    # nennt: es sind zwei Geräte an zwei Orten, jedes mit eigener 2-m-Umgebung.
    nicht_zusammenfassen_mit: feuerloescher

  - typ: erste_hilfe
    bezeichnung: "Erste-Hilfe-Stelle"
    aktiviert_regeln: [SL-05-ERSTE-HILFE-STELLE]
    leuchtenart: sicherheitsleuchte
    max_horizontal_zum_punkt_mm: 2000
    norm_ref: "ÖNORM EN 1838:2013 §4.1.2 h), S.9 (Erste-Hilfe-Stellen)"
    beleg: BELEGT
    lux_anforderung:
      # [BELEGT] §4.1.2 h), Norm-S.9 — „nahe jeder Erste-Hilfe-Stelle, so dass
      # 5 lx vertikale Beleuchtungsstärke am Erste-Hilfe-Kasten erreicht werden".
      norm_wert: 5.0
      norm_bezugsflaeche: vertikal
      norm_status: BELEGT
      norm_quelle: "ÖNORM EN 1838:2013 §4.1.2 h), S.9"
      lb_typisch: null
      lb_quelle: null
    cad_symbol_beleg: "din_ErsteHilfe_E003, ERSTEHILFESTELLE_RZ, ISO7010_RZ_ErsteHilfe"
    datenquellen: [manuell, elektroplan_kuenftig]
    review_erforderlich: true

  - typ: brandmelder
    bezeichnung: "Brandmelde-/Meldeeinrichtung (Druckknopfmelder, BMZ-Bedienstelle)"
    aktiviert_regeln: [SL-08-BRANDMELDER]
    leuchtenart: sicherheitsleuchte
    max_horizontal_zum_punkt_mm: 2000
    norm_ref: "ÖNORM EN 1838:2013 §4.1.2 i), S.9 (Meldeeinrichtungen)"
    beleg: BELEGT
    lux_anforderung:
      # [BELEGT] §4.1.2 i), Norm-S.9 — 5 lx vertikal an der Meldeeinrichtung und
      # an den Anzeigen der Brandmeldeanlage.
      norm_wert: 5.0
      norm_bezugsflaeche: vertikal
      norm_status: BELEGT
      norm_quelle: "ÖNORM EN 1838:2013 §4.1.2 i), S.9"
      lb_typisch: null
      lb_quelle: null
    # Anders als bei den drei oberen: im Repo liegt KEIN CAD-Symbol dafür vor.
    cad_symbol_beleg: null
    datenquellen: [manuell]
    review_erforderlich: true

  - typ: niveauaenderung
    bezeichnung: "Niveausprung im Fluchtweg ohne Treppe (Stufe, Rampe, Podest)"
    aktiviert_regeln: [RZ-06-NIVEAUAENDERUNG, SL-04-NIVEAUAENDERUNG]
    leuchtenart: sicherheitsleuchte    # zusätzlich RZ-06 (Rettungszeichen)
    max_horizontal_zum_punkt_mm: 2000
    # Korrektur vom 01.09. (am Volltext geprüft): §4.1.2 führt b) Treppen und
    # c) „jede andere Niveauänderung" als ZWEI getrennte Punkte auf. Der Auslöser
    # ist damit normativ belegt — die frühere Annahme, er stamme nur aus der LB,
    # beruhte auf einer unvollständigen Extraktion (docs/NORMQUELLEN_AT.md 2c).
    norm_ref: "ÖNORM EN 1838:2013 §4.1.2 c), S.8"
    beleg: BELEGT
    lux_anforderung:
      # Anders als h) und i) nennt c) KEIN Beleuchtungsniveau — nur „nahe"
      # (ANMERKUNG 1: ≤ 2 m horizontal). Hier bleibt der Lux-Wert offen.
      norm_wert: null
      norm_status: MANUELL_PRUEFEN
      lb_typisch: null
      lb_quelle: "LBVorgabe.rz_stellen enthält 'niveauaenderung'"
    cad_symbol_beleg: null
    datenquellen: [architektur_dxf_kuenftig, manuell]
    review_erforderlich: true

# ── Raum-Eigenschaften: gehören NICHT in das Punkt-Modell ──────────────────
raum_attribute:

  - attribut: ist_barrierefrei
    typ: bool
    default: false
    aktiviert_regeln: [SL-10-BARRIEREFREIES-WC]
    # Korrektur 05.09. am Original: §4.3.8 steht auf Norm-S.11, nicht S.12.
    norm_ref: "ÖNORM EN 1838:2013 §4.3.8, S.11"
    beleg: BELEGT
    begruendung: >
      Eigenschaft des RAUMS, nicht einer Stelle: die Antipanikbeleuchtung gilt für
      die Toilette als Ganzes. Die Raumerkennung vergibt heute WC, kann aber
      barrierefrei nicht unterscheiden.
    datenquellen: [architektur_dxf_kuenftig, manuell]

  - attribut: besondere_gefaehrdung
    typ: bool
    default: false
    aktiviert_regeln: [SL-11-BESONDERE-GEFAEHRDUNG]
    # Korrektur 05.09. am Original: §4.4.1 steht auf Norm-S.12, nicht S.13.
    norm_ref: "ÖNORM EN 1838:2013 §4.4.1, S.12"
    beleg: BELEGT
    begruendung: >
      §4.4.1 knüpft an den ARBEITSPLATZ/die Aufgabe an, nicht an einen Punkt: der
      geforderte Wert (10 % des Wartungswertes, mind. 15 lx) gilt für die
      Aufgabenfläche. Ein Punkt-Modell könnte das nicht ausdrücken.
    offen: >
      Gefährdungszonen, die nur einen TEIL eines Raumes betreffen, sind mit einem
      Raum-Flag nicht abbildbar → bleibt MANUELL_PRUEFEN.
    datenquellen: [manuell]

# ── Woher eine Sonderstelle kommen kann ────────────────────────────────────
# Ehrlichkeits-Regel: `erkannt_heute: false` überall dort, wo es keinen erprobten
# Parser gibt. Nichts wird als automatisch erkennbar markiert, nur weil es
# plausibel klingt.
datenquellen:

  architektur_dxf_heute:
    beschreibung: "Leerer Architekturplan, wie er heute geparst wird"
    erkannt_heute: false
    befund: >
      Gegengeprüft an Mollgasse EG und 1KG (2026-08-31): keine Feuerlöscher-,
      Hydranten-, Erste-Hilfe- oder Melder-Symbole. Die wenigen Treffer sind
      Fließtext-Anmerkungen ohne Position. Der Architekturplan ist KEINE Quelle.

  architektur_dxf_kuenftig:
    beschreibung: "Architekturplan, falls die Erkennung erweitert wird"
    erkannt_heute: false
    befund: "Für Niveauänderungen denkbar (Stufen/Rampen sind Geometrie), heute nicht umgesetzt."

  elektro_lb_ohne_position:
    beschreibung: "Leistungsbeschreibung (2. Input)"
    erkannt_heute: true
    einschraenkung: >
      Die LB liefert die ANFORDERUNG, nicht den ORT. `SonderLux` trägt `ort` (ein
      Typ-Label wie 'feuerloescher') und `min_lux` — keine Koordinate. Sie kann
      damit den Lux-Wert einer Sonderstelle setzen, aber keine Sonderstelle
      erzeugen.

  elektroplan_kuenftig:
    beschreibung: "Bestückter Elektro-/Notbeleuchtungsplan als zusätzlicher Input"
    erkannt_heute: false
    befund: >
      Fachlich die naheliegendste Quelle: professionelle Pläne führen die Symbole
      (F001/F002/E003). Im Repo liegt aber nur die Symbol-BIBLIOTHEK, kein
      bestückter Plan — kein Parser, kein Beleg, dass es funktioniert.

  manuell:
    beschreibung: "Angabe durch den Planer (Projektkontext / API-Eingabe)"
    erkannt_heute: true
    befund: >
      Die einzige Quelle, die HEUTE tragfähig ist. Deshalb ist der Contract-
      Vorschlag so geschnitten, dass er ohne Parser nutzbar ist.

# ── Beobachtet, aber ohne Regel — bewusst NICHT aufgenommen ────────────────
beobachtet_ohne_regel:
  - symbol: "din_Notrufstelle_E004 / ISO7010_RZ_Notrufsprechstelle"
    fundort: "din_support_ReMi_Barawitzkagasse_28.04.2026.dxf"
    warum_nicht: >
      Eine Notrufsprechstelle ist plausibel eine „Meldeeinrichtung" im Sinne von
      §4.1.2, aber keine Regel der Matrix braucht sie heute. Aufnahme erst, wenn
      eine Regel sie fordert — sonst wäre es ein erfundener Typ.

# ═══════════════════════════════════════════════════════════════════════════
# norm_anforderung — was der Platzierer je Typ bekommt (Query-API)
# ═══════════════════════════════════════════════════════════════════════════
#
# Zweck: der Platzierer soll für eine Sonderstelle die ANFORDERUNG DIESES TYPS
# samt seiner ECHTEN Fundstelle bekommen — statt sich die erstbeste Raumregel der
# passenden Leuchtenart zu greifen (Befund an PR #95: eine Feuerlöscher-Leuchte
# trug `§4.1` aus der STIEGENHAUS-Regel, ein Niveauänderungs-RZ `§4.2.1` aus der
# GANG-Regel).
#
# `quelle` ist der String, der als `Platzierung.norm_quelle` in den Audit-Trail
# geht. Er muss in `NormRegelwerk.quellen` liegen (Naht-Invariante) — der
# En1838NormProvider nimmt die Strings von hier in den Snapshot auf.
#
# `symbol_wie` verweist auf eine bestehende Regel in raumtyp_regeln.yaml, statt
# Katalog-Keys und Montagehöhen ein zweites Mal zu führen. EN 1838 schreibt für
# eine hervorzuhebende Stelle KEIN eigenes Symbol und KEINE eigene Höhe vor; es
# gilt der allgemeine Floor §4.1.1 (2 m). Deshalb wird geliehen, nicht erfunden.
#
# KEIN horizontaler Lux-Wert: §4.1.2 macht an diesen Stellen ausschließlich
# VERTIKALE Vorgaben (h/i: 5 lx am Gerät) oder gar keine (c). Ein horizontaler
# Wert wird hier bewusst nicht geführt — er stünde sonst im Bodenraster.
# ═══════════════════════════════════════════════════════════════════════════
norm_anforderung:

  typen:
    feuerloescher:
      klassifikation: sicherheitsleuchte
      quelle: "ÖNORM EN 1838:2013 §4.1.2 i)"
      symbol_wie: {raum_typ: STIEGENHAUS, ist_fluchtweg: true}
      lux_bezugsflaeche: vertikal_am_geraet

    hydrant:
      klassifikation: sicherheitsleuchte
      quelle: "ÖNORM EN 1838:2013 §4.1.2 i)"
      symbol_wie: {raum_typ: STIEGENHAUS, ist_fluchtweg: true}
      lux_bezugsflaeche: vertikal_am_geraet

    erste_hilfe:
      klassifikation: sicherheitsleuchte
      quelle: "ÖNORM EN 1838:2013 §4.1.2 h)"
      symbol_wie: {raum_typ: STIEGENHAUS, ist_fluchtweg: true}
      lux_bezugsflaeche: vertikal_am_geraet

    brandmelder:
      klassifikation: sicherheitsleuchte
      quelle: "ÖNORM EN 1838:2013 §4.1.2 i)"
      symbol_wie: {raum_typ: STIEGENHAUS, ist_fluchtweg: true}
      lux_bezugsflaeche: vertikal_am_geraet

    niveauaenderung:
      # §4.1.2 c) belegt eine SICHERHEITSLEUCHTE — nicht mehr. Die Einleitung von
      # §4.1.2 (Norm-S.8) sagt: „Sicherheitsleuchten … müssen … zur Hervorhebung
      # nahe jeder Ausgangstür und an potentiellen Gefahrenstellen … angebracht
      # werden. Die hervorzuhebenden Stellen umfassen die folgenden Punkte." Die
      # Aufzählung a)–k) sagt also, WO eine Sicherheitsleuchte hin muss.
      klassifikation: sicherheitsleuchte
      quelle: "ÖNORM EN 1838:2013 §4.1.2 c)"
      symbol_wie: {raum_typ: STIEGENHAUS, ist_fluchtweg: true}
      lux_bezugsflaeche: null      # c) nennt kein Beleuchtungsniveau

      # Ein zusätzliches RETTUNGSZEICHEN an der Niveauänderung ist damit NICHT
      # belegt — c) fordert kein Zeichen, und §4.1.2 d) verlangt nur, dass
      # VORHANDENE Sicherheitszeichen beleuchtet sind; es begründet keine neue
      # Zeichenpflicht. Deshalb kein Norm-Default, sondern ein Kandidat, der eine
      # eigene Entscheidungs-Quelle braucht (Korrektur 05.09.2026).
      zur_pruefung:
        - klassifikation: rz
          quelle: null                     # bewusst KEINE Norm-Fundstelle
          symbol_wie: {raum_typ: GANG, ist_fluchtweg: true}
          decision_source: lb_explizit
          begruendung: >
            Die reale Elektro-LB fordert an Niveauänderungen ein Rettungszeichen
            (LBVorgabe.rz_stellen enthält 'niveauaenderung') — das ist eine
            explizite Auftraggeber-Vorgabe (Rang 4), kein EN-1838-Default.
            Liegt keine solche LB vor, entsteht KEINE RZ-Pflicht: die Norm nennt
            an dieser Stelle nur die Sicherheitsleuchte. Wer das RZ dennoch
            setzt, muss es als lb_explizit bzw. Referenz-Praxis ausweisen und
            nicht unter §4.1.2 c) führen.

  raum_attribute:
    ist_barrierefrei:
      klassifikation: antipanik
      quelle: "ÖNORM EN 1838:2013 §4.3.8"
      symbol_wie: {raum_typ: SAAL, ist_fluchtweg: false}
      # §4.3.8 wörtlich (Norm-S.11, am Original geprüft): „Antipanikbeleuchtung
      # ist in Toiletten für Menschen mit Behinderung erforderlich."
      # Der Auslöser ist also NICHT „barrierefrei", sondern „barrierefreie
      # TOILETTE" — das Flag allein genügt nicht, der Raumtyp gehört dazu
      # (Korrektur 05.09.2026). Ein barrierefreies Zimmer löst §4.3.8 nicht aus.
      gilt_nur_fuer_raumtypen: [WC, SANITAER, SANITÄR, BAD, DUSCHE, NASSRAUM, TOILETTE]
      raumtyp_pflicht: true     # ohne Raumtyp keine Entscheidung (fail closed)
      # §4.3.8 nennt keinen eigenen Zahlenwert; es gilt das Niveau der
      # Antipanikbeleuchtung (§4.3.1: 0,5 lx horizontal auf der freien
      # Bodenfläche im Kernbereich, Randbereiche 0,5 m ausgenommen).
      lux_wie: antipanik
      lux_bezugsflaeche: horizontal_boden

    besondere_gefaehrdung:
      klassifikation: sicherheitsleuchte
      quelle: "ÖNORM EN 1838:2013 §4.4.1"
      symbol_wie: {raum_typ: STIEGENHAUS, ist_fluchtweg: true}
      # §4.4.1 wörtlich (Norm-S.12, am Original geprüft): „In Bereichen von
      # Arbeitsplätzen mit besonderer Gefährdung muss der Wartungswert der
      # Beleuchtungsstärke AUF DER ARBEITSFLÄCHE mindestens 10 % des für die
      # Aufgabe erforderlichen Wartungswertes der Beleuchtungsstärke betragen
      # und darf nicht unter 15 lx fallen."
      # Bezugsfläche ist die ARBEITSFLÄCHE — nicht pauschal der Boden und nicht
      # pauschal horizontal (die Aufgabenfläche kann geneigt oder vertikal sein).
      lux_bezugsflaeche: arbeitsflaeche
      lux_mindestwert: 15.0            # absolute Untergrenze, §4.4.1
      lux_anteil_nennbeleuchtung: 0.10 # 10 % des Aufgaben-Wartungswertes
      # Beide Werte sind belegt, der Nachweis ist trotzdem nicht vollständig
      # führbar: der 10-%-Anteil braucht den Wartungswert der AUFGABEN-
      # beleuchtung, und die Arbeitsfläche selbst (Lage, Neigung, Ausdehnung)
      # ist im RaumModell nicht beschrieben. Deshalb bleibt der vollständige
      # Nachweis offen — das Contract-Feld `arbeitsplatz_lux` bleibt leer.
      nachweis_offen_grund: >
        §4.4.1 fordert auf der Arbeitsfläche 10 % des für die Aufgabe
        erforderlichen Wartungswertes, mindestens 15 lx. Die Aufgaben-
        beleuchtungsstärke ist kein Eingang der Engine und die Arbeitsfläche ist
        im RaumModell nicht beschrieben → der 15-lx-Mindestwert ist prüfbar, der
        10-%-Anteil und die Bezugsfläche sind es nicht. Nachweis bleibt offen.
