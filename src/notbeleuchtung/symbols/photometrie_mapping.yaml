# Naht zum Lux-Nachweis (platzierung/lux.py via i_cd_fn): statt der isotropen
# 200-cd-Annahme die echte Lichtverteilung der eingesetzten Schrack-Leuchte.
# Herkunft/Audit-Trail der Dateien: CAD_Symbole/photometrie/QUELLEN.md.
