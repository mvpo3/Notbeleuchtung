  notlicht_ks_stiege_links: rz_nlpxw433_1h3h_picto.ldt
  notlicht_ks_stiege_rechts: rz_nlpxw433_1h3h_picto.ldt
  notlicht_kw_garage: sl_nlkbu433_3h_round.ldt
  sicherheitsleuchte_aufheller: sl_nlkbu433_3h_round.ldt
